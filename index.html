    </tr>`).join('');

  // 🔴 `PART-3` 素材库 —— ⚠️ 📌 propose／approve 两个函数 2026-09-18 就建好了，
  //   ⭐ 但**⛔ 无任何调用方** ⇒ 库里 0 行，而门户写着「只能使用库里的素材对外宣传」。
  const PT_ASSET_KIND = {
    intro: osT('adminPtAssetKindIntro'), case: osT('adminPtAssetKindCase'),
    poster: osT('adminPtAssetKindPoster'), script: osT('adminPtAssetKindScript'),
  };
  const PT_ASSET_STATUS = {
    pending: osT('adminPtAssetStatusPending'), published: osT('adminPtAssetStatusPublished'),
    rejected: osT('adminPtAssetStatusRejected'), retired: osT('adminPtAssetStatusRetired'),
  };
  const assetRows = (assets.assets ?? []).map((a) => `
    <tr>
      <td>${escapeHtml(PT_ASSET_KIND[a.kind] ?? a.kind)}</td>
      <td>${escapeHtml(a.title)}<br><span class="muted">${escapeHtml(String(a.body_template ?? a.file_path ?? '').slice(0, 80))}</span></td>
      <td>${escapeHtml(PT_ASSET_STATUS[a.status] ?? a.status)}</td>
      <td class="mono">${escapeHtml(a.proposed_by)}</td>
      <td>
        ${a.status === 'pending'
          ? `<label><input type="checkbox" data-ack="d" data-for="${a.id}"> ${escapeHtml(osT('adminPtAssetAckDiagnosis'))}</label>
             <label><input type="checkbox" data-ack="e" data-for="${a.id}"> ${escapeHtml(osT('adminPtAssetAckEfficacy'))}</label>
             <label><input type="checkbox" data-ack="i" data-for="${a.id}"> ${escapeHtml(osT('adminPtAssetAckIncome'))}</label>
             <button class="ghost-btn" data-pt-asset-approve="${a.id}">${escapeHtml(osT('adminPtAssetBtnApprove'))}</button>
             <button class="ghost-btn" data-pt-asset-reject="${a.id}">${escapeHtml(osT('adminPtAssetBtnReject'))}</button>`
          : '—'}
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="panel">
      <h2>${escapeHtml(osT('adminPtHeading'))}</h2>
      <p class="hint">${escapeHtml(osT('adminPtIntro'))}</p>
      ${rows ? `<table class="data-table">
        <thead><tr>
          <th>${escapeHtml(osT('adminPtColName'))}</th><th>${escapeHtml(osT('adminPtColStatus'))}</th>
          <th>${escapeHtml(osT('adminPtColEntity'))}</th><th>${escapeHtml(osT('adminPtColContract'))}</th>
          <th>${escapeHtml(osT('adminPtColKyc'))}</th><th>${escapeHtml(osT('adminPtColActions'))}</th>
        </tr></thead><tbody>${rows}</tbody></table>`
        : `<p class="muted">${escapeHtml(osT('adminCommonEmpty'))}</p>`}
    </div>

    <div class="panel">
      <h2>${escapeHtml(osT('adminPtPendingHeading'))}</h2>
      ${pendingRows ? `<table class="data-table">
        <thead><tr>
          <th>${escapeHtml(osT('adminPtColName'))}</th><th>${escapeHtml(osT('adminPtColDecision'))}</th>
          <th>${escapeHtml(osT('adminPtColContract'))}</th><th>${escapeHtml(osT('adminPtColProposer'))}</th>
          <th>${escapeHtml(osT('adminPtColReason'))}</th><th>${escapeHtml(osT('adminPtColActions'))}</th>
        </tr></thead><tbody>${pendingRows}</tbody></table>`
        : `<p class="muted">${escapeHtml(osT('adminPtPendingEmpty'))}</p>`}
    </div>

    <div class="panel">
      <h2>${escapeHtml(osT('adminPtAssetHeading'))}</h2>
      <p class="hint">${escapeHtml(osT('adminPtAssetIntro'))}</p>
      ${assetRows ? `<table class="data-table">
        <thead><tr>
          <th>${escapeHtml(osT('adminPtAssetColKind'))}</th><th>${escapeHtml(osT('adminPtAssetColTitle'))}</th>
          <th>${escapeHtml(osT('adminPtColStatus'))}</th><th>${escapeHtml(osT('adminPtAssetColProposer'))}</th>
          <th>${escapeHtml(osT('adminPtColActions'))}</th>
        </tr></thead><tbody>${assetRows}</tbody></table>
        <p class="hint">${escapeHtml(osT('adminPtAssetAckHint'))}</p>`
        : `<p class="muted">${escapeHtml(osT('adminPtAssetEmpty'))}</p>`}
    </div>

    <div class="panel">
      <h2>${escapeHtml(osT('adminPtAssetProposeHeading'))}</h2>
      <label>${escapeHtml(osT('adminPtAssetFieldKind'))}
        <select id="ptAssetKind">
          ${Object.keys(PT_ASSET_KIND).map((k) =>
            `<option value="${k}">${escapeHtml(PT_ASSET_KIND[k])}</option>`).join('')}
        </select></label>
      <label>${escapeHtml(osT('adminPtAssetFieldTitle'))}<input id="ptAssetTitle" type="text"></label>
      <label>${escapeHtml(osT('adminPtAssetFieldBody'))}<textarea id="ptAssetBody" rows="4"></textarea></label>
      <label>${escapeHtml(osT('adminPtAssetFieldFile'))}<input id="ptAssetFile" type="text"></label>
      <label>${escapeHtml(osT('adminPtAssetFieldNote'))}<input id="ptAssetNote" type="text"></label>
      <button id="ptAssetProposeBtn">${escapeHtml(osT('adminPtAssetBtnPropose'))}</button>
      <p class="hint">${escapeHtml(osT('adminPtAssetProposeHint'))}</p>
    </div>

    <div class="panel">
      <h2>${escapeHtml(osT('adminPtRegisterHeading'))}</h2>
      <label>${escapeHtml(osT('adminPtFieldLegalName'))}<input id="ptName" type="text"></label>
      <label>${escapeHtml(osT('adminPtFieldEntity'))}<input id="ptEntity" type="text" value="HUB_SG"></label>
      <label>${escapeHtml(osT('adminPtFieldRegNo'))}<input id="ptRegNo" type="text"></label>
      <label>${escapeHtml(osT('adminPtFieldCountry'))}<input id="ptCountry" type="text" maxlength="2"></label>
      <button id="ptRegisterBtn">${escapeHtml(osT('adminPtBtnRegister'))}</button>
      <p class="hint">${escapeHtml(osT('adminPtKycHint'))}</p>
    </div>
    <p id="ptMsg" class="status"></p>`;

  const msg = el.querySelector('#ptMsg');
  const say = (text, isError) => {
    msg.textContent = text;
    msg.className = isError ? 'error' : 'status';
  };
  const run = async (body) => {
    try {
      const r = await ptCall(body);
      say(osT('adminPtDone') + (r?.result?.issued_code
        ? osT('adminPtCodeIssued') + r.result.issued_code : ''), false);
      renderPartnersTab(el);
    } catch (e) {
      // ⚠️ 🔴 **原样显示后端给的错误码** —— 📌 ⛔ 翻译成「操作失败」：
      //   ⭐ `PARTNER_CONTRACT_REQUIRED` 这种码本身就告诉了运营**缺什么**。
      say(String(e.message || e), true);
    }
  };

  el.querySelector('#ptRegisterBtn').onclick = () => run({
    action: 'register',
    legalName: el.querySelector('#ptName').value.trim(),
    contractingEntity: el.querySelector('#ptEntity').value.trim(),
    registrationNo: el.querySelector('#ptRegNo').value.trim() || null,
    country: el.querySelector('#ptCountry').value.trim().toUpperCase() || null,
  });

  el.querySelectorAll('[data-pt-propose]').forEach((b) => {
    b.onclick = () => {
      const v = prompt(osT('adminPtPromptContract'));
      if (!v) return;
      const signed = prompt(osT('adminPtPromptSignedAt'));
      if (!signed) return;
      const reason = prompt(osT('adminPtPromptReason'));
      if (!reason) return;
      run({
        action: 'propose', companyId: b.dataset.ptPropose, decision: 'active',
        reason, contractVersion: v, contractSignedAt: signed, kycStatus: 'passed',
      });
    };
  });
  el.querySelectorAll('[data-pt-terminate]').forEach((b) => {
    b.onclick = () => {
      const reason = prompt(osT('adminPtPromptReason'));
      if (!reason) return;
      run({ action: 'propose', companyId: b.dataset.ptTerminate, decision: 'terminated', reason });
    };
  });
  el.querySelectorAll('[data-pt-suspend]').forEach((b) => {
    b.onclick = () => {
      const reason = prompt(osT('adminPtPromptReason'));
      if (!reason) return;
      run({ action: 'suspend', companyId: b.dataset.ptSuspend, reason });
    };
  });
  el.querySelectorAll('[data-pt-code]').forEach((b) => {
    b.onclick = () => run({ action: 'issue_code', companyId: b.dataset.ptCode });
  });
  el.querySelectorAll('[data-pt-approve]').forEach((b) => {
    b.onclick = () => {
      const note = prompt(osT('adminPtPromptNote'));
      run({ action: 'approve', requestId: b.dataset.ptApprove, note: note || null });
    };
  });
  el.querySelectorAll('[data-pt-reject]').forEach((b) => {
    b.onclick = () => {
      const note = prompt(osT('adminPtPromptNote'));
      if (!note) return;
      run({ action: 'reject', requestId: b.dataset.ptReject, note });
    };
  });

  // ══ 🔴 素材库 ══
  // ⚠️ 📌 **这三个 RPC 的「失败」⛔ 走异常，是返回 `{ok:false}`**（合规阻断、勾选缺失）
  //   ⇒ 🔴 用上面那个通用 `run()` 会当场显示「完成」，⭐ 而素材根本⛔ 无发布。
  //   ⇒ 📌 所以单写一个 —— ⚠️ 这正是「⛔ 报错 ≠ 成功」的又一处。
  const runAsset = async (body) => {
    try {
      const r = await ptCall(body);
      const res = r?.result ?? {};
      if (res.ok === false) {
        if (res.error === 'PARTNER_ASSET_COMPLIANCE_BLOCKED') {
          say(osT('adminPtAssetBlocked') + (res.hits ?? []).join('、'), true);
        } else if (res.error === 'PARTNER_ASSET_ACK_REQUIRED') {
          say(osT('adminPtAssetAckMissing'), true);
        } else {
          say(String(res.error ?? 'FAILED'), true);
        }
        return;
      }
      say(osT('adminPtDone'), false);
      renderPartnersTab(el);
    } catch (e) {
      say(String(e.message || e), true);
    }
  };

  const ptAssetProposeBtn = el.querySelector('#ptAssetProposeBtn');
  if (ptAssetProposeBtn) {
    ptAssetProposeBtn.onclick = () => runAsset({
      action: 'asset_propose',
      kind: el.querySelector('#ptAssetKind').value,
      title: el.querySelector('#ptAssetTitle').value.trim(),
      body: el.querySelector('#ptAssetBody').value.trim() || null,
      filePath: el.querySelector('#ptAssetFile').value.trim() || null,
      note: el.querySelector('#ptAssetNote').value.trim(),
    });
  }

  el.querySelectorAll('[data-pt-asset-approve]').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.ptAssetApprove;
      const ack = (which) =>
        el.querySelector(`input[data-ack="${which}"][data-for="${id}"]`)?.checked === true;
      // 🔴 **原样传三个布尔，⛔ 许在这里先判一遍再拦** ——
      //   ⚠️ 📌 前端拦一道看着友好，⭐ 但那会让「服务端必须自己拒」这条**⛔ 再被任何用例覆盖**。
      runAsset({
        action: 'asset_approve', assetId: id,
        ackNoDiagnosis: ack('d'), ackNoEfficacy: ack('e'), ackNoIncomePromise: ack('i'),
      });
    };
  });
  el.querySelectorAll('[data-pt-asset-reject]').forEach((b) => {
    b.onclick = () => {
      const note = prompt(osT('adminPtPromptNote'));
      if (!note) return;
      runAsset({ action: 'asset_reject', assetId: b.dataset.ptAssetReject, note });
    };
  });

}

// ==================== 预约退款（TD-110 §十一）====================
// 🔴 这一屏要回答三件事：
//   ① 退了哪些、到哪一步了（列表与状态）
//   ② 第 2 步平台费退回失败的，怎么重来（失败重试）
//   ③ 机构自己点不了的时候，运营怎么代发起（必填工单号）
//
// ⚠️ 代发起走的是 `sfk-os-booking-refund-create` —— **和门户同一个函数**。
//   📌 不在后台另写一条路径：金额校验、行锁、拆分算法只许有一份。
const RF_STATUS_LABEL = {
  pending: osT('adminRfFilterPending'), succeeded: osT('adminRfFilterSucceeded'),
  failed: osT('adminRfFilterFailed'), canceled: osT('refundStatusCanceled'),
};
const RF_FEE_LABEL = {
  succeeded: osT('adminRfFeeSucceeded'), pending: osT('adminRfFeePending'),
  failed: osT('adminRfFeeFailed'), not_applicable: osT('adminRfFeeNotApplicable'),
};
const RF_SGD = (v) => 'S$' + Number(v ?? 0).toFixed(2);

// ============================================================
// 🔴 `TD-210` 第二段步 4 · **到店付申诉核实**（`TXN-1` 决策 16 e 第 ② 步）
// ============================================================
// ## ⭐ `verified_credit_cents = 0` 是**合法**的，且与「驳回」**⛔ 是一回事**
// 📌 `verified + 0` ＝ **核过了、按口径⛔ 该退钱**；⚠️ `rejected` ＝ **申诉⛔ 成立**。
// ⇒ ## 🔴 两者合并之后，就**再也分⛔ 出「我们核过⛔ 无」** —— ⭐ 所以界面上分两个按钮。
//
// ## ⚠️ 金额**空着⛔ 许当成 0**
// 📌 「核实了⛔ 冲减」与「忘了填金额」在库里长得一模一样 ⇒ 🔴 服务端回 `CREDIT_REQUIRED`。
async function renderAtVenueDisputesTab(el) {
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-admin-at-venue-disputes', { action: 'list' });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  const list = r.disputes ?? [];
  if (list.length === 0) {
    el.innerHTML = `<section class="panel"><h2>${escapeHtml(osT('admDisputesTab'))}</h2>
      <p class="muted">${escapeHtml(osT('admDisputesEmpty'))}</p></section>`;
    return;
  }
  const cents = (c, cur) => `${String(cur || '').toUpperCase()} ${(Number(c || 0) / 100).toFixed(2)}`;
  const rows = list.map((d) => {
    const st = d.institution_at_venue_settlements ?? {};
    const done = d.status === 'credited' || d.status === 'rejected';
    return `<tr>
      <td>${escapeHtml(d.institutions?.name ?? d.institution_id)}</td>
      <td class="muted">${escapeHtml(String(st.period_month ?? ''))}</td>
      <td>${escapeHtml(osT('admDisputesClaimed'))} ${escapeHtml(cents(d.claimed_fee_cents, st.currency))}</td>
      <td>${escapeHtml(d.reason ?? '')}</td>
      <td>${escapeHtml(d.status)}</td>
      <td>${done ? '' : `<input type="number" min="0" step="1" style="width:110px"
            id="dcredit-${escapeHtml(d.id)}" placeholder="${escapeHtml(osT('admDisputesCredit'))}">`}</td>
      <td>${done ? '' : `<button class="ghost-btn" data-verify="${escapeHtml(d.id)}"
            data-claimed="${Number(d.claimed_fee_cents)}">${escapeHtml(osT('admDisputesVerify'))}</button>
          <button class="ghost-btn" data-reject="${escapeHtml(d.id)}">${escapeHtml(osT('admDisputesReject'))}</button>`}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<section class="panel">
    <h2>${escapeHtml(osT('admDisputesTab'))}</h2>
    <p class="hint">${escapeHtml(osT('admDisputesCreditZeroHint'))}</p>
    <table><tbody>${rows}</tbody></table>
    <p id="dispStatus" class="hint"></p>
  </section>`;

  const statusEl = el.querySelector('#dispStatus');
  const decide = async (id, decision, creditCents) => {
    statusEl.textContent = osT('adminCommonLoading');
    try {
      await callFn('sfk-admin-at-venue-disputes', {
        action: 'decide', disputeId: id, decision, creditCents,
      });
      statusEl.textContent = osT('admDisputesDone');
      renderAtVenueDisputesTab(el);
    } catch (e) {
      // 🔴 **把码翻成人话** —— ⚠️ 📌 运营⛔ 该看到 `CREDIT_EXCEEDS_CLAIM`
      const MAP = {
        CREDIT_EXCEEDS_CLAIM: 'admDisputesExceeds',
        CREDIT_REQUIRED: 'admDisputesCreditRequired',
        ALREADY_CREDITED: 'admDisputesAlreadyCredited',
      };
      statusEl.textContent = MAP[e.code] ? osT(MAP[e.code]) : (e.message || osT('adminCommonLoadFailed'));
    }
  };
  el.querySelectorAll('[data-verify]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.verify;
    const raw = document.getElementById(`dcredit-${id}`)?.value ?? '';
    // ⭐ 📌 空着就**⛔ 发请求** —— ⚠️ 服务端也会拒（`CREDIT_REQUIRED`），
    //   🔴 但在这里先说一句，运营⛔ 用为一次⛔ 必要的往返等着。
    if (raw.trim() === '') { statusEl.textContent = osT('admDisputesCreditRequired'); return; }
    decide(id, 'verified', Number(raw));
  }));
  el.querySelectorAll('[data-reject]').forEach((b) => b.addEventListener('click',
    () => decide(b.dataset.reject, 'rejected')));
}

async function renderRefundsTab(el, filter) {
  const wanted = filter ?? 'all';
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-admin-booking-refunds', { action: 'list', status: wanted });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  state.refundsPending = r.pendingCount ?? 0;
  state.refundsFeeFailed = r.feeFailedCount ?? 0;
  state.refundsStuck = r.stuckCount ?? 0;

  const rows = (r.refunds ?? []).map((x) => {
    const ticket = x.institution_support_ticket_id || x.cs_ticket_id || '';
    // ⚠️ 只对**真的失败了的**给重试按钮 —— 对已成功的行点重试，幂等键会让
    //   Stripe 原样返回旧退款、看起来「成功」，运营会以为修好了一件没坏的事。
    const canRetry = x.fee_refund_status === 'failed';
    return `
    <tr>
      <td>${escapeHtml(x.institution_name || x.booking_id)}</td>
      <td>${escapeHtml(RF_SGD(x.amount))}</td>
      <td>${escapeHtml(RF_STATUS_LABEL[x.status] ?? x.status)}</td>
      <td>${x.fee_refund_status === 'failed'
        ? '<span class="badge badge-rejected">' + escapeHtml(RF_FEE_LABEL.failed) + '</span>'
        : escapeHtml(RF_FEE_LABEL[x.fee_refund_status] ?? x.fee_refund_status ?? '')}</td>
      <td>${escapeHtml(x.reason ?? '')}${x.reason_note ? '<div class="muted">' + escapeHtml(x.reason_note) + '</div>' : ''}</td>
      <td>${escapeHtml(x.initiator_role === 'admin' ? osT('adminRfInitiatorAdmin') : osT('adminRfInitiatorInstitution'))}</td>
      <td class="muted">${escapeHtml(ticket)}</td>
      <td class="muted">${formatDate(x.created_at)}</td>
      <td>${canRetry ? `<button class="ghost-btn" data-retry="${escapeHtml(x.id)}">${escapeHtml(osT('adminRfRetry'))}</button>` : ''}</td>
    </tr>
    ${x.failure_reason ? `<tr><td colspan="9" class="muted">${escapeHtml(x.failure_reason)}</td></tr>` : ''}`;
  }).join('');

  el.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('adminRfHeading'))}
        <span class="hint">${escapeHtml(osT('adminRfCounts').replace('{n}', r.pendingCount ?? 0))}${
          r.feeFailedCount ? ` · <span class="error">${escapeHtml(osT('adminRfFeeFailedBadge'))} ${r.feeFailedCount}</span>` : ''}${
          r.stuckCount ? ` · <span class="error">${escapeHtml(osT('adminRfStuckBadge').replace('{n}', r.stuckHours))} ${r.stuckCount}</span>` : ''}</span>
      </h2>
      <form class="inline-form" id="rfFilter">
        <select id="rfStatus">
          <option value="all"${wanted === 'all' ? ' selected' : ''}>${escapeHtml(osT('adminRfFilterAll'))}</option>
          <option value="pending"${wanted === 'pending' ? ' selected' : ''}>${escapeHtml(osT('adminRfFilterPending'))}</option>
          <option value="succeeded"${wanted === 'succeeded' ? ' selected' : ''}>${escapeHtml(osT('adminRfFilterSucceeded'))}</option>
          <option value="failed"${wanted === 'failed' ? ' selected' : ''}>${escapeHtml(osT('adminRfFilterFailed'))}</option>
        </select>
        <button type="submit">${escapeHtml(osT('adminRfFilterSubmit'))}</button>
      </form>
      ${rows ? `<table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminRfColOrg'))}</th><th>${escapeHtml(osT('adminRfColAmount'))}</th><th>${escapeHtml(osT('adminRfColStatus'))}</th><th>${escapeHtml(osT('adminRfColFeeBack'))}</th><th>${escapeHtml(osT('adminRfColReason'))}</th><th>${escapeHtml(osT('adminRfColInitiator'))}</th><th>${escapeHtml(osT('adminRfColTicket'))}</th><th>${escapeHtml(osT('adminRfColTime'))}</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`
      : `<p class="muted">${escapeHtml(osT('adminRfEmpty'))}</p>`}
      ${r.truncated ? `<p class="hint">${escapeHtml(osT('adminRfTruncated').replace('{n}', r.limit))}</p>` : ''}
      ${r.stuckCount === null ? `<p class="hint">${escapeHtml(osT('adminRfStuckHoursUnset'))}</p>` : ''}
      ${r.stuckCount ? `<p class="hint">${escapeHtml(osT('adminRfStuckLocks'))}</p>` : ''}
      <div class="muted" id="rfRetryMsg"></div>
    </section>
    <section class="panel">
      <h2>${escapeHtml(osT('adminRfIssueHeading'))}</h2>
      <form class="inline-form" id="rfLookupForm">
        <label>${escapeHtml(osT('adminRfBookingId'))}
          <input type="text" id="rfBookingId" required>
        </label>
        <button type="submit">${escapeHtml(osT('adminRfLookup'))}</button>
      </form>
      <div id="rfIssueBox"></div>
    </section>
  `;

  document.getElementById('rfFilter').addEventListener('submit', (e) => {
    e.preventDefault();
    renderRefundsTab(el, document.getElementById('rfStatus').value);
  });

  el.querySelectorAll('[data-retry]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const msg = document.getElementById('rfRetryMsg');
      btn.disabled = true;
      msg.textContent = osT('adminCommonLoading');
      try {
        const res = await callFn('sfk-admin-booking-refunds', { action: 'retry', refundId: btn.dataset.retry });
        msg.textContent = res.outcome?.result === 'failed'
          ? osT('adminRfRetryFailed') + (res.outcome.reason ?? '')
          : osT('adminRfRetryOk');
      } catch (e) {
        msg.textContent = osT('adminRfRetryFailed') + e.message;
      }
      renderRefundsTab(el, wanted);
    });
  });

  document.getElementById('rfLookupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    await rfLookup(document.getElementById('rfBookingId').value.trim(), el, wanted);
  });
  renderAppTabsOnly();
}

// ⭐ 代发起分两步：先查单，再填。
//   🔴 不允许「直接填个金额就退」—— ⚠️ 运营看不到可退余额时，
//   填超的那一刻才会撞校验，而那时它已经以为自己退成了。
async function rfLookup(bookingId, el, wanted) {
  const box = document.getElementById('rfIssueBox');
  if (!bookingId) return;
  box.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let d;
  try {
    d = await callFn('sfk-admin-booking-refunds', { action: 'lookup', bookingId });
  } catch (e) {
    box.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  // ⚠️ `booking_payments.booking_id` 有 UNIQUE 约束 ⇒ 一个预约至多一笔付款。
  //   （曾误以为可能有多笔、写过一个选择器 —— 那是 JOIN 扇出造成的误读，已撤回。）
  const p = d.payment;
  const max = d.refundableCents ?? 0;
  const codes = (d.reasonCodes ?? []);
  box.innerHTML = `
    <p>${escapeHtml(d.institutionName ?? '')} · ${escapeHtml(osT('adminRfRefundableIs'))}<b>${escapeHtml(RF_SGD(max / 100))}</b></p>
    <form class="inline-form" id="rfIssueForm">
      <label>${escapeHtml(osT('refundAmountLabel'))}
        <input type="number" step="0.01" min="0.01" max="${(max / 100).toFixed(2)}" value="${(max / 100).toFixed(2)}" id="rfAmount" required>
      </label>
      <label>${escapeHtml(osT('refundReasonLabel'))}
        <select id="rfReason">${codes.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select>
      </label>
      <label>${escapeHtml(osT('refundReasonNoteLabel'))}
        <input type="text" id="rfNote">
      </label>
      <label>${escapeHtml(osT('adminRfTicketKind'))}
        <select id="rfTicketKind">
          <option value="institution">${escapeHtml(osT('adminRfTicketInstitution'))}</option>
          <option value="cs">${escapeHtml(osT('adminRfTicketCs'))}</option>
        </select>
      </label>
      <label>${escapeHtml(osT('adminRfTicketId'))}
        <input type="text" id="rfTicket" required>
      </label>
      <button type="submit">${escapeHtml(osT('refundSubmit'))}</button>
    </form>
    <div id="rfIssuePreview" class="muted"></div>
    <div id="rfIssueMsg" class="muted"></div>`;

  // ⚠️ 四行预览：退款前就把账算给运营看，和门户给机构看的是同一笔账。
  const paidCents = Math.round(Number(p.amount) * 100);
  const repaint = () => {
    const c = Math.round(Number(document.getElementById('rfAmount').value || 0) * 100);
    const box2 = document.getElementById('rfIssuePreview');
    if (!(c > 0) || c > max) { box2.innerHTML = ''; return; }
    const ratio = c / paidCents;
    const flo = (v) => Math.floor(Math.round(Number(v ?? 0) * 100) * ratio);
    const m = (x) => 'S$' + (x / 100).toFixed(2);
    box2.innerHTML = `<div><b>${escapeHtml(osT('refundPreviewHeading'))}</b></div>`
      + `<div>${escapeHtml(osT('refundPreviewCustomer'))} ${escapeHtml(m(c))}</div>`
      + `<div>${escapeHtml(osT('refundPreviewDebit'))} −${escapeHtml(m(c))}</div>`
      + `<div>${escapeHtml(osT('refundPreviewPlatformBack'))} +${escapeHtml(m(flo(p.commission_amount) + flo(p.points_promotion_amount)))}</div>`
      + `<div>${escapeHtml(osT('refundPreviewSettlementKept'))} ${escapeHtml(m(flo(p.settlement_fee_amount)))}</div>`;
  };
  document.getElementById('rfAmount').addEventListener('input', repaint);
  repaint();

  document.getElementById('rfIssueForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('rfIssueMsg');
    const ticket = document.getElementById('rfTicket').value.trim();
    // 🔴 §16.3：代发起必须挂恰好一个工单。服务端和数据库都会再拦一次，
    //   这里先拦是为了给一句人看得懂的话，而不是让它撞 400。
    if (!ticket) { msg.textContent = osT('adminRfNeedTicket'); return; }
    const cents = Math.round(Number(document.getElementById('rfAmount').value || 0) * 100);
    if (!(cents > 0) || cents > max) { msg.textContent = osT('refundErrExceeds'); return; }
    const kind = document.getElementById('rfTicketKind').value;
    ev.submitter && (ev.submitter.disabled = true);
    msg.textContent = osT('refundSubmitting');
    try {
      await callFn('sfk-os-booking-refund-create', {
        bookingPaymentId: p.id,
        amountCents: cents,
        reason: document.getElementById('rfReason').value,
        reasonNote: document.getElementById('rfNote').value || undefined,
        institutionSupportTicketId: kind === 'institution' ? ticket : undefined,
        csTicketId: kind === 'cs' ? ticket : undefined,
      });
      // ⚠️ 不写「已退款」—— 同步响应只代表 Stripe 收下了请求，到账与否以回调为准。
      msg.textContent = osT('refundPending') + ' — ' + osT('refundPendingNote');
      setTimeout(() => renderRefundsTab(el, wanted), 1500);
    } catch (e) {
      ev.submitter && (ev.submitter.disabled = false);
      msg.textContent = e.message;
    }
  });
}

// ==================== 机构工单（OPS-11①）====================
// 🔴 这一屏的存在理由：`institution_support_tickets` / `_replies` 表 ✅、
//   `sfk-os-support-ticket-submit` ✅、`sfk-os-support-ticket-reply` ✅，
//   **⛔ 唯独后台零引用** ⇒ 机构提交的工单没有任何人看得到。
//   ⭐ 回复复用已有的 reply 函数（它本来就同时服务两侧，状态机写在那里），
//     ⛔ 不另写一套 —— 两份状态机迟早不一致。
const TICKET_STATUS_LABEL = {
  open: osT('adminTkStOpen'), pending: osT('adminTkStPending'), resolved: osT('adminTkStResolved'), closed: osT('adminTkStClosed'),
};

async function renderTicketsTab(el, filter) {
  const wanted = filter ?? 'open';
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-admin-support-tickets', { action: 'list', status: wanted });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  state.ticketsOpen = r.openCount ?? 0;
  state.ticketsOverdue = r.overdueCount ?? 0;

  const rows = (r.tickets ?? []).map((t) => `
    <tr>
      <td>${t.overdue ? '<span class="badge badge-rejected">' + escapeHtml(osT('adminTkOverdue')) + '</span> ' : ''}${escapeHtml(t.institution_name || t.institution_id)}</td>
      <td>${escapeHtml(t.category)}</td>
      <td>${escapeHtml(t.priority)}</td>
      <td>${escapeHtml(String(t.description ?? '').slice(0, 60))}</td>
      <td>${escapeHtml(TICKET_STATUS_LABEL[t.status] ?? t.status)}</td>
      <td class="muted">${formatDate(t.created_at)}</td>
      <td class="muted">${t.first_responded_at ? formatDate(t.first_responded_at) : '<span class="error">' + escapeHtml(osT('adminTkNoResponse')) + '</span>'}</td>
      <td><button class="ghost-btn" data-ticket="${escapeHtml(t.id)}">${escapeHtml(osT('adminTkView'))}</button></td>
    </tr>`).join('');

  el.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('adminTkHeading'))}
        <span class="hint">${escapeHtml(osT('adminTkCounts').replace('{open}', r.openCount ?? 0))}${r.overdueCount ? ` · <span class="error">${escapeHtml(osT('adminTkOverdueCounts').replace('{n}', r.overdueCount))}</span>` : ''}</span>
      </h2>
      <form class="inline-form" id="ticketFilter">
        <select id="ticketStatus">
          <option value="open"${wanted === 'open' ? ' selected' : ''}>${escapeHtml(osT('adminTkFilterOpen'))}</option>
          <option value="resolved"${wanted === 'resolved' ? ' selected' : ''}>${escapeHtml(osT('adminTkFilterResolved'))}</option>
          <option value="closed"${wanted === 'closed' ? ' selected' : ''}>${escapeHtml(osT('adminTkFilterClosed'))}</option>
          <option value="all"${wanted === 'all' ? ' selected' : ''}>${escapeHtml(osT('adminTkFilterAll'))}</option>
        </select>
        <button type="submit">${escapeHtml(osT('adminTkFilterSubmit'))}</button>
      </form>
      ${rows ? `<table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminTkColOrg'))}</th><th>${escapeHtml(osT('adminTkColCategory'))}</th><th>${escapeHtml(osT('adminTkColPriority'))}</th><th>${escapeHtml(osT('adminTkColDesc'))}</th><th>${escapeHtml(osT('adminTkColStatus'))}</th><th>${escapeHtml(osT('adminTkColSubmitted'))}</th><th>${escapeHtml(osT('adminTkColFirstResp'))}</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`
      : `<p class="muted">${escapeHtml(osT('adminTkEmpty'))}</p>`}
      <p class="hint" style="margin-top:12px">
        ${osT('adminTkOverdueNote')}
      </p>
    </section>
    <section class="panel hidden" id="ticketDetail"></section>
  `;

  document.getElementById('ticketFilter').addEventListener('submit', (e) => {
    e.preventDefault();
    renderTicketsTab(el, document.getElementById('ticketStatus').value);
  });
  el.querySelectorAll('[data-ticket]').forEach((btn) => {
    btn.addEventListener('click', () => openTicketDetail(btn.dataset.ticket, el, wanted));
  });
  renderAppTabsOnly();
}

async function openTicketDetail(ticketId, listEl, curFilter) {
  const box = document.getElementById('ticketDetail');
  box.classList.remove('hidden');
  box.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let d;
  try {
    d = await callFn('sfk-admin-support-tickets', { action: 'detail', ticketId });
  } catch (e) {
    box.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  const t = d.ticket;
  const replies = (d.replies ?? []).map((r) => `
    <div style="padding:10px 12px;margin:8px 0;border-radius:10px;background:${r.author_type === 'admin' ? '#F0F6F2' : '#F7F7F7'}">
      <div class="muted" style="font-size:12px">${escapeHtml(r.author_label)} · ${formatDate(r.created_at)}</div>
      <div>${escapeHtml(r.body)}</div>
    </div>`).join('') || `<p class="muted">${escapeHtml(osT('adminTkNoReplies'))}</p>`;

  box.innerHTML = `
    <h3>${escapeHtml(osT('adminTkDetailHeading'))} <span class="mono muted">${escapeHtml(t.id)}</span></h3>
    <p class="hint">
      ${escapeHtml(t.institution_name || t.institution_id)} · ${escapeHtml(t.category)} ·
      ${escapeHtml(t.priority)} · ${escapeHtml(osT('adminTkCurrentStatus'))} <strong>${escapeHtml(TICKET_STATUS_LABEL[t.status] ?? t.status)}</strong>
    </p>
    <p style="white-space:pre-wrap">${escapeHtml(t.description)}</p>
    <h4>${escapeHtml(osT('adminTkThread'))}</h4>
    ${replies}
    <h4>${escapeHtml(osT('adminTkReply'))}</h4>
    <form id="ticketReplyForm" class="stack-form">
      <textarea id="ticketReplyBody" rows="4" placeholder="${escapeHtml(osT('adminTkReplyPh'))}"></textarea>
      <label>${escapeHtml(osT('adminTkSetStatus'))}
        <select id="ticketReplyStatus">
          <option value="">${escapeHtml(osT('adminTkStatusDefault'))}</option>
          <option value="resolved">${escapeHtml(osT('adminTkStResolved'))}</option>
          <option value="closed">${escapeHtml(osT('adminTkStClosed'))}</option>
        </select>
      </label>
      <button type="submit">${escapeHtml(osT('adminTkSubmitReply'))}</button>
    </form>
    <p id="ticketReplyStatusMsg" class="status"></p>
    <p class="hint">
      ${osT('adminTkReplySameFnNote')}
    </p>
  `;

  document.getElementById('ticketReplyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById('ticketReplyStatusMsg');
    const bodyText = document.getElementById('ticketReplyBody').value.trim();
    if (!bodyText) { msgEl.textContent = osT('adminTkReplyEmpty'); return; }
    const newStatus = document.getElementById('ticketReplyStatus').value;
    msgEl.textContent = osT('adminCommonSubmitting');
    try {
      const payload = { ticketId, body: bodyText };
      if (newStatus) payload.status = newStatus;
      await callFn('sfk-os-support-ticket-reply', payload);
      msgEl.textContent = osT('adminCommonSubmitted');
      await renderTicketsTab(listEl, curFilter);
    } catch (err) {
      msgEl.textContent = osT('adminCommonSubmitFailed') + err.message;
    }
  });
}

// ==================== 客户端错误（OPS-11③）====================
// 🔴 存在理由：`client_error_log` 表在、客户端十几处在写，后台⛔ 无界面
//   ⇒ 用户报「打不开」时运营查不了，只能找开发连数据库。
// =====================================================================
// F5 步骤3 · 客服知识库（第零层的内容管理）
// =====================================================================
// 🔴 **它是一等功能，⛔ 不是附属品**（设计稿 §二·2.4）：
//   决策 2 的省钱逻辑是「每次 AI 被迫出手 ⇒ 补一条 ⇒ 下次免费」
//   ⇒ ⚠️ **省钱靠的是【持续补条目】，⛔ 不是那份种子有多长。**
// ⭐ 因此这一页刻意做了两件事：
//   ① **按命中数倒序** —— 让补条目的人**看得到成效**；
//   ② **新建表单常驻页面顶部** —— ⛔ 不藏在弹窗或二级页里。
// ⚠️ 服务端还有两道守卫（⛔ 不只靠这个界面）：关键词必填、医疗表述拦截。
async function renderCsKbTab(el, opts) {
  const o = opts ?? { scope: '' };
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-admin-cs-kb', { action: 'list', scope: o.scope || undefined, q: o.q || undefined });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  // 🔴 consumer 这条**⛔ 不许改成 Agent** —— C 端「客服」是【义务】称谓（决策 1-bis）。
  const SCOPE_LABEL = { consumer: osT('agentScopeConsumer'), institution: osT('agentScopeInstitution') };
  const rows = (r.rows ?? []).map((x) => `
    <tr${x.is_active ? '' : ' class="muted"'}>
      <td>${escapeHtml(SCOPE_LABEL[x.scope] || x.scope)}</td>
      <td>${escapeHtml(x.question)}</td>
      <td class="mono">${escapeHtml((x.keywords || []).join(' / '))}</td>
      <td style="text-align:right">${x.hit_count ?? 0}</td>
      <td>${escapeHtml(osT(x.is_active ? 'adminKbActive' : 'adminKbInactive'))}</td>
      <td>
        <button type="button" class="kbEdit" data-id="${escapeHtml(x.id)}">${escapeHtml(osT('adminKbEdit'))}</button>
        <button type="button" class="kbToggle" data-id="${escapeHtml(x.id)}" data-active="${x.is_active ? '1' : '0'}">${escapeHtml(osT(x.is_active ? 'adminKbDisable' : 'adminKbEnable'))}</button>
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('adminKbFormHeading'))}
        <span class="hint">${escapeHtml(osT('adminKbStats').replace('{total}', r.total).replace('{hits}', r.totalHits))}</span></h2>
      <p class="hint">${osT('adminKbWhy')}</p>
      <form id="kbForm" class="stacked-form">
        <input type="hidden" id="kbId" value="" />
        <label>${escapeHtml(osT('adminKbScope'))}
          <select id="kbScope">
            <option value="consumer">${escapeHtml(osT('adminKbScopeConsumerFull'))}</option>
            <option value="institution">${escapeHtml(osT('agentScopeInstitution'))}${escapeHtml(osT('adminKbScopeInstSuffix'))}</option>
          </select>
        </label>
        <label>${escapeHtml(osT('adminKbQuestion'))}
          <input type="text" id="kbQuestion" maxlength="200" placeholder="${escapeHtml(osT('adminKbQuestionPh'))}" />
        </label>
        <label>${escapeHtml(osT('adminKbAnswer'))}
          <textarea id="kbAnswer" rows="4" maxlength="1000" placeholder="${escapeHtml(osT('adminKbAnswerPh'))}"></textarea>
        </label>
        <label>${escapeHtml(osT('adminKbKeywords'))}
          <input type="text" id="kbKeywords" placeholder="${escapeHtml(osT('adminKbKeywordsPh'))}" />
        </label>
        <label>${escapeHtml(osT('adminKbDeeplink'))}
          <input type="text" id="kbDeepLink" placeholder="#billing" />
        </label>
        <div>
          <button type="submit">${escapeHtml(osT('adminCommonSave'))}</button>
          <button type="button" id="kbReset">${escapeHtml(osT('adminCommonClear'))}</button>
          <span id="kbMsg" class="hint"></span>
        </div>
      </form>
    </section>
    <section class="panel">
      <h2>${escapeHtml(osT('adminKbListHeading'))} <span class="hint">${escapeHtml(osT('adminKbListHint'))}</span></h2>
      <form class="inline-form" id="kbFilter">
        <select id="kbFScope">
          <option value=""${o.scope ? '' : ' selected'}>${escapeHtml(osT('adminKbFilterAll'))}</option>
          <option value="consumer"${o.scope === 'consumer' ? ' selected' : ''}>${escapeHtml(osT('adminKbScopeConsumer'))}</option>
          <option value="institution"${o.scope === 'institution' ? ' selected' : ''}>${escapeHtml(osT('adminKbScopeInstitution'))}</option>
        </select>
        <input type="text" id="kbFQ" placeholder="${escapeHtml(osT('adminKbSearchPh'))}" value="${escapeHtml(o.q || '')}" />
        <button type="submit">${escapeHtml(osT('adminTkFilterSubmit'))}</button>
      </form>
      ${rows ? `<table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminKbColScope'))}</th><th>${escapeHtml(osT('adminKbColQuestion'))}</th><th>${escapeHtml(osT('adminKbColKeywords'))}</th><th>${escapeHtml(osT('adminKbColHits'))}</th><th>${escapeHtml(osT('adminTkColStatus'))}</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>` : ('<p class="muted">' + escapeHtml(osT('adminKbEmpty')) + '</p>')}
    </section>`;

  const msg = el.querySelector('#kbMsg');

  // F5 步骤6：从周报「AI 答不了」那一行点「补知识库」跳过来 ⇒ 把问题带过来。
  // ⭐ **只带【问题】，⛔ 不带答案** —— 🔴 答案必须是人写的：
  //   本页有医疗表述拦截与关键词必填两道守卫，而**⛔ 没有任何东西能替运营
  //   判断这条该怎么答**。⚠️ 自动填一个答案会让人顺手点保存。
  if (state.kbPrefill) {
    el.querySelector('#kbScope').value = state.kbPrefill.scope;
    el.querySelector('#kbQuestion').value = state.kbPrefill.question;
    msg.textContent = osT('adminKbPrefilled');
    state.kbPrefill = null;   // ⚠️ 用完即清，⛔ 不让它在标签间反复自动填
  }

  el.querySelector('#kbFilter').addEventListener('submit', (ev) => {
    ev.preventDefault();
    renderCsKbTab(el, { scope: el.querySelector('#kbFScope').value, q: el.querySelector('#kbFQ').value });
  });
  el.querySelector('#kbReset').addEventListener('click', () => {
    el.querySelector('#kbId').value = '';
    ['kbQuestion','kbAnswer','kbKeywords','kbDeepLink'].forEach((id) => { el.querySelector('#' + id).value = ''; });
    msg.textContent = '';
  });
  el.querySelectorAll('.kbEdit').forEach((b) => b.addEventListener('click', () => {
    const row = (r.rows ?? []).find((x) => x.id === b.dataset.id);
    if (!row) return;
    el.querySelector('#kbId').value = row.id;
    el.querySelector('#kbScope').value = row.scope;
    el.querySelector('#kbQuestion').value = row.question;
    el.querySelector('#kbAnswer').value = row.answer;
    el.querySelector('#kbKeywords').value = (row.keywords || []).join(' ');
    el.querySelector('#kbDeepLink').value = row.deep_link || '';
    msg.textContent = osT('adminKbEditing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));
  el.querySelectorAll('.kbToggle').forEach((b) => b.addEventListener('click', async () => {
    try {
      await callFn('sfk-admin-cs-kb', { action: 'toggle', id: b.dataset.id, isActive: b.dataset.active !== '1' });
      renderCsKbTab(el, o);
    } catch (e) { msg.textContent = osT('adminCommonOpFailed') + e.message; }
  }));
  el.querySelector('#kbForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.textContent = osT('adminCommonSaving');
    const keywords = el.querySelector('#kbKeywords').value.split(/[\s,，、]+/).filter(Boolean);
    try {
      await callFn('sfk-admin-cs-kb', {
        action: 'upsert',
        id: el.querySelector('#kbId').value || undefined,
        scope: el.querySelector('#kbScope').value,
        question: el.querySelector('#kbQuestion').value,
        answer: el.querySelector('#kbAnswer').value,
        keywords,
        deepLink: el.querySelector('#kbDeepLink').value,
      });
      renderCsKbTab(el, o);
    } catch (e) {
      // ⚠️ 服务端的守卫提示（合规拦截/关键词必填）要**原样显示给运营**，
      //   ⛔ 不要压成一句「保存失败」—— 那样运营⛔ 不知道该怎么改。
      msg.textContent = osT('adminCommonSaveFailed') + e.message;
    }
  });
}

// =====================================================================
// 🔴 `TD-190` · 反馈**采纳判定**与**发奖**（`CS-3` 决策 9）
// =====================================================================
// ## ⭐ 这一页要解决的问题
// 📌 用户提了反馈、被聚类、进了周报 —— 🔴 **然后就没有然后了**：
//   ⚠️ ⛔ 无人判「采不采纳」，⛔ 无人发那 100 Token，
//   ⇒ 📌 决策 9 承诺的「被采纳有奖」在产品里**⛔ 存在**。
//
// ## ⚠️ 三件事写在页面上，⛔ 让运营自己猜
// ① 🔴 **看⛔ 到原话** —— 📌 `raw_ciphertext` 是加密存的，钥匙在用户那边。
//    ⭐ ⇒ 这一页给的是**频次 ＋ 分类 ＋ 判定**，⚠️ ⛔ 是「原话⛔ 无显示出来」。
// ② 🔴 **「采纳」⛔ 可撤销** —— 📌 它同事务发钱，⚠️ 而 Token 发出去就是负债。
//    ⇒ ⭐ 所以点它要二次确认；📌 已判过的聚类**原样返回**，⛔ 会再发一次。
// ③ 🔴 **额度未设定 ⇒ 整条判定被拒** —— ⚠️ ⛔ 是「先记采纳、以后补发」：
//    📌 ⛔ 无补发流程的「以后补发」是空承诺，⭐ 而空承诺⛔ 会报错。
//
// ## ⭐ 发奖对象是**首条提交者**，⛔ 是全员
// 📌 ⛔ 则「多人提同一条」会变成刷奖入口 —— ⚠️ 而聚类正是把它们并成一条的那一步。
// =====================================================================
async function renderCsFeedbackTab(el, opts) {
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-admin-cs-feedback', { action: 'clusters', limit: 200 });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  const rows = r?.clusters ?? [];
  const DEC_LABEL = {
    adopted: osT('adminFbDecAdopted'),
    not_now: osT('adminFbDecNotNow'),
    duplicate: osT('adminFbDecDuplicate'),
  };
  el.innerHTML = `
    <p class="hint">${escapeHtml(osT('adminFbNoRaw'))}</p>
    <table class="data"><thead><tr>
      <th>${escapeHtml(osT('adminFbColCluster'))}</th>
      <th>${escapeHtml(osT('adminFbColCount'))}</th>
      <th>${escapeHtml(osT('adminFbColCategory'))}</th>
      <th>${escapeHtml(osT('adminFbColFirst'))}</th>
      <th>${escapeHtml(osT('adminFbColLast'))}</th>
      <th>${escapeHtml(osT('adminFbColDecision'))}</th>
    </tr></thead><tbody>
    ${rows.map((c) => {
      const decided = c.decided
        ? `${escapeHtml(DEC_LABEL[c.decided] ?? c.decided)}${
            // ⭐ 发了多少，就显示多少 —— 🔴 ⛔ 显示配置里的「应发」
            c.awarded_amount != null ? ` · ${escapeHtml(osT('adminFbAwarded'))} ${Number(c.awarded_amount)}` : ''
          }`
        : ['adopted', 'not_now', 'duplicate'].map((d) =>
            `<button class="fbDec" data-k="${escapeHtml(c.cluster_key)}" data-d="${d}">${
              escapeHtml(DEC_LABEL[d])}</button>`).join(' ');
      return `<tr>
        <td><code>${escapeHtml(c.cluster_key)}</code></td>
        <td>${Number(c.cnt)}</td>
        <td>${escapeHtml(c.category ?? '—')}</td>
        <td>${escapeHtml((c.first_at ?? '').slice(0, 10))}</td>
        <td>${escapeHtml((c.last_at ?? '').slice(0, 10))}</td>
        <td>${decided || escapeHtml(osT('adminFbUndecided'))}</td>
      </tr>`;
    }).join('')}
    </tbody></table>`;

  el.querySelectorAll('.fbDec').forEach((b) => {
    b.addEventListener('click', async () => {
      const decision = b.dataset.d;
      let reason = null;
      // 🔴 「暂不采纳」必须写理由 —— ⚠️ 服务端也有一条 CHECK 挡着（📌 两处⛔ 是重复：
      //   ⭐ 这里是**⛔ 让人白跑一趟**，那里是**⛔ 让脏数据落库**）。
      if (decision === 'not_now') {
        reason = window.prompt(osT('adminFbReasonPrompt'));
        if (!reason || !reason.trim()) return;
      }
      // ⚠️ 只有「采纳」要二次确认 —— 📌 ⭐ 只有它**会把钱发出去**。
      if (decision === 'adopted' && !window.confirm(osT('adminFbConfirmAdopt'))) return;
      b.disabled = true;
      try {
        const x = await callFn('sfk-admin-cs-feedback', {
          action: 'decide', clusterKey: b.dataset.k, decision, reason,
        });
        // 🔴 RPC 用 `{ok:false,error:…}` 表达**业务拒绝**（⚠️ ⛔ 抛异常）
        //   ⇒ 📌 ⛔ 看这个字段，被拒的判定会显示成「成功」。
        if (x && x.ok === false) {
          alert(x.error === 'CONFIG_MISSING' ? osT('adminFbConfigMissing') : x.error);
        }
      } catch (e) {
        alert(e.message);
      }
      renderCsFeedbackTab(el, opts);
    });
  });
}

// =====================================================================
// F5 步骤6 · 客服周报（决策 5）
// =====================================================================
// 🔴 **决策 5 原文定了这一页的形状**：
//   「**⛔ 不做成『本周处理 N 条、满意度 X%』那种没人看的报表。**」
//   ⇒ ⭐ 因此这一页**先放【用户说了什么】，把数字放到最后** ——
//     ⚠️ 顺序⛔ 不是排版偏好，是**决策记录里的优先级**（吐槽 / 同一问题 / 建议）。
//
// 🔴 **硬要求**：「**每一条都必须能点开原始对话全文**」
//   ⇒ 每行一个「原文」按钮 ⇒ 走 `reveal` ⇒ ⚠️ **每点一次都会留一条访问痕**
//     （`admin_cs_content_read`）—— ⭐ 这是**故意的**，⛔ 不是副作用。
//
// ⚠️ **三处口径必须写在页面上，⛔ 不能让运营自己猜**（见函数内各处 hint）：
//   ① M/N 是 **C 端口径**（B 端走月度额度，⛔ 不写这张表）；
//   ② 🔴 **`auto_expired` 单列**，且**今天恒为 0** —— 自动关单机制**还没实现**
//      ⇒ ⭐ 「**没有发生**」和「**没有人在数**」是两件事，⛔ 不让 0 冒充前者；
//   ③ ⚠️ **归类可能整片为空**（`ANTHROPIC_API_KEY` 未配）⇒ 归「未归类」，
//      ⛔ 不显示成「⛔ 没有人反馈同一个问题」。
async function renderCsDigestTab(el, opts) {
  const o = opts ?? { days: 7 };
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-cs-weekly-digest', { action: 'digest', days: o.days });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }

  const CAT = { complaint: osT('adminFbCatComplaint'), suggestion: osT('adminFbCatSuggestion'), praise: osT('adminFbCatPraise'), bug: osT('adminFbCatBug') };
  const SRC = { ai_cannot_answer: osT('adminFbSrcAiCannotAnswer'), cap_reached: osT('adminFbSrcCapReached'), overage_declined: osT('adminFbSrcOverageDeclined') };
  const ST = { open: osT('adminFbStNew'), pending: osT('adminFbStInProgress'), resolved: osT('adminTkStResolved'), closed: osT('adminTkStClosed'), auto_expired: osT('adminFbStAutoExpired') };

  // 一条反馈的一行。⭐ `textSource` 要显示出来 —— 🔴 **让读的人知道自己在读的
  //   是【原话】还是【AI 归一化后的话】**，⛔ 不许混着看不出来。
  const fbRow = (f) => `
    <tr>
      <td class="mono">${escapeHtml(formatDate(f.createdAt))}</td>
      <td>${escapeHtml(CAT[f.category] || osT('adminFbCatNone'))}</td>
      <td>${escapeHtml(f.text || osT('adminFbDecryptFailed'))}
        ${f.textSource === 'raw' ? ('<span class="hint">' + escapeHtml(osT('adminFbSrcRaw')) + '</span>') : ('<span class="hint">' + escapeHtml(osT('adminFbSrcNormalised')) + '</span>')}</td>
      <td class="mono">${escapeHtml(f.clusterKey || '—')}</td>
      <td><button type="button" class="ghost-btn revealBtn" data-kind="cs_feedback" data-id="${escapeHtml(f.id)}">${escapeHtml(osT('adminFbReveal'))}</button></td>
    </tr>`;

  const fbTable = (list, empty) => list.length
    ? `<table class="data-table"><thead><tr><th>${escapeHtml(osT('adminColTime'))}</th><th>${escapeHtml(osT('adminColCategory'))}</th><th>${escapeHtml(osT('adminColContent'))}</th><th>${escapeHtml(osT('adminColClusterKey'))}</th><th></th></tr></thead>
       <tbody>${list.map(fbRow).join('')}</tbody></table>`
    : `<p class="muted">${empty}</p>`;

  const s = r.ticketStats || {}, fs = r.feedbackStats || {}, c = r.cost || {};
  const ratio = (c.aiCalls + c.kbDirect) > 0
    ? Math.round((c.kbDirect / (c.aiCalls + c.kbDirect)) * 100) : null;

  el.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestHeading'))} <span class="hint">${escapeHtml(formatDate(r.window?.since))} — ${escapeHtml(formatDate(r.window?.until))}</span></h2>
      <form class="inline-form" id="digestFilter">
        <select id="dgDays">
          ${[7, 14, 30].map((d) => `<option value="${d}"${o.days === d ? ' selected' : ''}>${escapeHtml(osT('adminDigestDays').replace('{d}', d))}</option>`).join('')}
        </select>
        <button type="submit">${escapeHtml(osT('adminCommonRefresh'))}</button>
      </form>
      <p class="hint">${osT('adminDigestIntro')}</p>
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestStatus'))}</h2>
      <table class="data-table"><tbody>
        <tr><td>${escapeHtml(osT('adminDigestTotalTickets'))}</td><td>${s.total ?? 0}</td>
            <td class="hint">${escapeHtml(osT('adminDigestTotalHint'))}</td></tr>
        <tr><td><b>${escapeHtml(osT('adminDigestResolved'))}</b></td><td><b>${s.resolved ?? 0}</b></td>
            <td class="hint">${osT('adminDigestResolvedHint')}</td></tr>
        <tr><td>${escapeHtml(osT('adminDigestOpenPending'))}</td><td>${s.open ?? 0} / ${s.pending ?? 0}</td><td></td></tr>
        <tr><td>${escapeHtml(osT('adminDigestAutoExpired'))}</td><td>${s.autoExpired ?? 0}</td>
            <td class="hint">${osT('adminDigestAutoExpiredHint')}
              ${s.autoExpireSweepDeployed === false
                ? osT('adminDigestSweepNotDeployed')
                : ''}</td></tr>
        <tr><td>${escapeHtml(osT('adminDigestTotalFeedback'))}</td><td>${fs.total ?? 0}</td>
            <td class="hint">${escapeHtml(osT('adminDigestFeedbackBreakdown').replace('{new}', fs.new ?? 0).replace('{prog}', fs.inProgress ?? 0).replace('{done}', fs.resolved ?? 0).replace('{wont}', fs.wontDo ?? 0))}</td></tr>
      </tbody></table>
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestS1'))} <span class="hint">${escapeHtml(osT('adminDigestS1Hint'))}</span></h2>
      ${fbTable(r.complaints || [], osT('adminDigestS1Empty'))}
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestS2'))} <span class="hint">${escapeHtml(osT('adminDigestS2Hint'))}</span></h2>
      ${/* 🔴 TD-55 ②：归并改成【周报生成时一次性做】⇒ 聚合数重新可信，恢复显示。
             ⚠️ **判据挂在 `clusterUnavailable` 上，不挂在 `clusters` 上** —— ⭐ 理由：
             🔴 **旧版函数产出的 JSON 里带着【逐条起名】那种不可信的 `clusters`**，
                若写成「有 clusters 就画表」，拿旧 JSON 渲染会把那个坏数字画出来。
             ⇒ ⭐ 新版永远二选一：要么 `clusters`（无 unavailable），
                要么 `clusterUnavailable` ⇒ **无 unavailable 且有 clusters 才画表**。 */ ''}
      ${r.clusterUnavailable
        ? ('<p class="status" style="color:#8a6d00">' + osT('adminDigestS2Failed')
           + (r.clusterUnavailable.note ? ('<br><span class="hint">' + escapeHtml(r.clusterUnavailable.note) + '</span>') : '')
           + '</p>')
        : ((r.clusters || []).length
          ? `<p class="hint">${osT('adminDigestS2Caveat')}</p>
        <table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminDigestS2Label'))}</th><th>${escapeHtml(osT('adminDigestColPeople'))}</th><th>${escapeHtml(osT('adminColClusterKey'))}</th></tr></thead>
        <tbody>${r.clusters.map((x) => `
          <tr><td>${x.key === '__unclustered__' ? escapeHtml(osT('adminDigestS2Unclustered')) : escapeHtml(x.label || x.key)}</td>
              <td>${x.count}</td>
              <td class="mono hint">${x.key === '__unclustered__' ? '—' : escapeHtml(x.key)}</td></tr>`).join('')}</tbody></table>
        ${r.clusterUsage ? `<p class="hint">${escapeHtml(osT('adminDigestS2Cost').replace('{model}', r.clusterUsage.model).replace('{in}', r.clusterUsage.inputTokens).replace('{out}', r.clusterUsage.outputTokens))}</p>` : ''}`
          : ('<p class="muted">' + escapeHtml(osT('adminDigestS2Empty')) + '</p>'))}
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestS3'))} <span class="hint">${escapeHtml(osT('adminDigestS3Hint'))}</span></h2>
      ${fbTable(r.suggestions || [], osT('adminDigestS3Empty'))}
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestS4'))} <span class="hint">${osT('adminDigestS4Hint')}</span></h2>
      ${(r.aiCannotAnswer || []).length ? `<table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminColTime'))}</th><th>${escapeHtml(osT('adminDigestColAudience'))}</th><th>${escapeHtml(osT('adminDigestColAsked'))}</th><th>${escapeHtml(osT('adminTkColStatus'))}</th><th></th></tr></thead>
        <tbody>${r.aiCannotAnswer.map((t) => `
          <tr><td class="mono">${escapeHtml(formatDate(t.at))}</td>
              <td>${escapeHtml(osT(t.scope === 'institution' ? 'adminKbScopeInstitution' : 'adminKbScopeConsumer'))}</td>
              <td>${escapeHtml(t.question || osT('adminDigestDecryptFailed'))}</td>
              <td>${escapeHtml(ST[t.status] || t.status)}</td>
              <td>
                <button type="button" class="ghost-btn revealBtn" data-kind="${t.scope === 'institution' ? 'os_ticket' : 'cs_ticket'}" data-id="${escapeHtml(t.id)}">${escapeHtml(osT('adminFbReveal'))}</button>
                ${/* ⚠️ 知识库那一页是 operator 才看得到的 ⇒ support 不显示这个按钮，
                      不做成「点了跳过去发现打不开」。 */ ''}
                ${hasRole('operator')
                  ? `<button type="button" class="kbFromTicket" data-scope="${t.scope}" data-q="${escapeHtml(t.question || '')}">${escapeHtml(osT('adminDigestAddToKb'))}</button>`
                  : ''}
              </td></tr>`).join('')}</tbody></table>`
        : ('<p class="muted">' + escapeHtml(osT('adminDigestS4Empty')) + '</p>')}
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestS5'))} <span class="hint">${escapeHtml(osT('adminDigestS5Hint'))}</span></h2>
      ${(c.followups || []).length ? `<table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminDigestColConversation'))}</th><th>${escapeHtml(osT('adminDigestColAnswered'))}</th></tr></thead>
        <tbody>${c.followups.map((f) => `<tr><td class="mono">${escapeHtml(f.conversationId)}</td><td>${f.turns}</td></tr>`).join('')}</tbody></table>`
        : ('<p class="muted">' + escapeHtml(osT('adminDigestS5Empty')) + '</p>')}
      <p class="hint">${osT('adminDigestS5Note')}</p>
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminDigestS6'))} <span class="hint">${escapeHtml(osT('adminDigestS6Hint'))}</span></h2>
      ${/* 🔴 步骤7：M/N 的【含义】随 cs.engine 而变 —— 不写出来，同一个百分比会被
            当成两种东西读。尤其 shadow 档：M+N > 总消息数，而看的人会默认它们互斥。 */ ''}
      <p class="hint">${escapeHtml(osT('adminDigestEngineLabel'))}<b class="mono">${escapeHtml(r.engine || osT('adminDigestEngineUnknown'))}</b> ——
        ${r.engine === 'native'
          ? osT('adminDigestEngineSfk')
          : r.engine === 'native_shadow'
            ? osT('adminDigestEngineShadow')
            : osT('adminDigestEngineOff')}
      </p>
      <table class="data-table"><tbody>
        <tr><td>${escapeHtml(osT('adminDigestKbDirect'))}</td><td>${c.kbDirect ?? 0}</td><td class="hint">${escapeHtml(osT('adminDigestZeroCost'))}</td></tr>
        <tr><td>${escapeHtml(osT('adminDigestAiCalls'))}</td><td>${c.aiCalls ?? 0}</td><td class="hint">${escapeHtml(osT('adminDigestPaidPart'))}</td></tr>
        <tr><td><b>${escapeHtml(osT('adminDigestRatio'))}</b></td><td><b>${ratio === null ? '—' : ratio + '%'}</b></td>
            <td class="hint">${escapeHtml(osT('adminDigestRatioHint'))}</td></tr>
        <tr><td>${escapeHtml(osT('adminDigestRelevance'))}</td><td>${c.relevanceChecks ?? 0}</td><td class="hint">${escapeHtml(osT('adminDigestRelevanceHint'))}</td></tr>
        <tr><td>${escapeHtml(osT('adminDigestFeedbackCalls'))}</td><td>${c.feedbackCalls ?? 0}</td>
            <td class="hint">${osT('adminDigestFeedbackCallsHint')}</td></tr>
        <tr><td>${escapeHtml(osT('adminDigestTokens'))}</td><td class="mono">${c.inputTokens ?? 0} / ${c.outputTokens ?? 0}</td><td></td></tr>
      </tbody></table>
      <p class="hint">${osT('adminDigestConsumerScopeNote')}</p>
      ${r.decryption && (r.decryption.failed || r.decryption.skipped) ? `<p class="error">
        ${osT('adminDigestDecryptNote').replace('{failed}', r.decryption.failed).replace('{skipped}', r.decryption.skipped).replace('{cap}', r.decryption.cap)}</p>` : ''}
    </section>

    <section class="panel" id="revealPanel" style="display:none">
      <h2>${escapeHtml(osT('adminRevealHeading'))} <span class="hint">${escapeHtml(osT('adminRevealHint'))}</span></h2>
      <pre id="revealBody" style="white-space:pre-wrap;word-break:break-word"></pre>
    </section>`;

  el.querySelector('#digestFilter').addEventListener('submit', (ev) => {
    ev.preventDefault();
    renderCsDigestTab(el, { days: Number(el.querySelector('#dgDays').value) });
  });

  el.querySelectorAll('.revealBtn').forEach((b) => b.addEventListener('click', async () => {
    const panel = el.querySelector('#revealPanel'), bodyEl = el.querySelector('#revealBody');
    panel.style.display = '';
    bodyEl.textContent = osT('adminReading');
    try {
      const x = await callFn('sfk-cs-weekly-digest', { action: 'reveal', kind: b.dataset.kind, id: b.dataset.id });
      bodyEl.textContent = (x.normalized ? (osT('adminNormalizedPrefix') + x.normalized + '\n\n---\n\n') : '') + (x.full || osT('adminRevealEmpty'));
    } catch (e) { bodyEl.textContent = osT('adminReadFailed') + e.message; }
    panel.scrollIntoView({ behavior: 'smooth' });
  }));

  // 🔴 §二·2.4：「**从这条工单一键新建知识库条目**」——
  //   ⭐ **在看到「AI 答不了」的那一刻就能补**，⛔ 不必回头另找地方录入。
  //   ⚠️ ⛔ 不直接在这一页建条目 —— 建条目有关键词必填/医疗表述拦截等守卫，
  //     那些都在知识库那一页上；这里只做**带着问题跳过去**。
  el.querySelectorAll('.kbFromTicket').forEach((b) => b.addEventListener('click', () => {
    state.kbPrefill = {
      scope: b.dataset.scope === 'institution' ? 'institution' : 'consumer',
      question: b.dataset.q || '',
    };
    state.tab = 'cskb';
    renderApp();
  }));
}

  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let facets = { sources: [], errorKinds: [] };
  let r;
  try {
    [facets, r] = await Promise.all([
      callFn('sfk-admin-client-errors', { action: 'facets' }),
      callFn('sfk-admin-client-errors', { action: 'list', ...o }),
    ]);
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }

  // ⚠️ 这一处是**单引号字符串**⛔ 不是模板串 ⇒ 🔴 `${…}` ⛔ 不会插值
  //   （抽文案时我一度按模板串的写法改，被 TD-47 那道闸门当场抓住）。
  const opt = (list, cur) => ['<option value="">' + escapeHtml(osT('adminKbFilterAll')) + '</option>']
    .concat(list.map((f) =>
      `<option value="${escapeHtml(f.value)}"${f.value === cur ? ' selected' : ''}>${escapeHtml(f.value)} (${f.count})</option>`))

  const rows = (r.rows ?? []).map((x) => `
    <tr>
      <td class="muted">${formatDate(x.created_at)}</td>
      <td class="mono">${escapeHtml(x.user_id || '-')}</td>
      <td>${escapeHtml(x.source)}</td>
      <td>${escapeHtml(x.error_kind)}</td>
      <td>${x.http_status ?? '-'}</td>
      <td class="mono">${escapeHtml(x.detail || '-')}${x.detail_truncated ? ' …' : ''}</td>
    </tr>`).join('');

  el.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('adminCeHeading'))} <span class="hint">${escapeHtml(osT('adminCeCount').replace('{n}', r.total))}</span></h2>
      <form class="inline-form" id="ceFilter">
        <select id="ceHours">
          ${[['1',osT('adminCeWin1h')],['24',osT('adminCeWin24h')],['168',osT('adminCeWin7d')],['720',osT('adminCeWin30d')]]
            .map(([v,l]) => `<option value="${v}"${String(o.sinceHours) === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>

// ==================== 运维告警（OPS-7a）====================
// 🔴 这一屏的存在理由：哨兵把失败写进 cron_alert_log，但「落表没人看」
//   本身就是静默失败。这里是那条**人会看到**的路径。
//
// ⚠️ **2026-09-04（OPS-11②③）起，这一屏已经不只装定时任务的失败**：
//   钱的事件（Apple 退款/撤销/宽限期结束、以及**我们自己没处理成功**的）
//   和客户端错误暴涨都汇到这里。⭐ 刻意⛔ 不新建第二个告警系统 ——
//   两个角标等于没有角标。
const ALERT_TYPE_LABEL = {
  http_failure: osT('adminAlertHttpFailure'),
  timeout: osT('adminAlertTimeout'),
  no_response: osT('adminAlertNoResponse'),
  notify_skipped: osT('adminAlertNotifySkipped'),
  // 🔴 这一条排最前面看：它的含义是**钱的事件我们没处理成功**
  billing_unhandled: osT('adminAlertBillingUnhandled'),
  billing_event: osT('adminAlertBillingEvent'),
  client_error_spike: osT('adminAlertClientErrorSpike'),
};
async function renderOpsAlertsTab(el) {
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}</p>`;
  let r;
  try {
    r = await callFn('sfk-admin-ops-alerts', { action: 'list' });
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml(e.message)}</p>`;
    return;
  }
  state.opsUnacked = r.unackedCount ?? 0;

  // ⭐ 「0 条告警」有两种截然不同的含义：一切正常 / 哨兵自己挂了。
  //   ⛔ 不能让它们看起来一样 —— 所以把哨兵最近一次派发时间一起摆出来。
  const last = r.lastDispatchAt ? new Date(r.lastDispatchAt) : null;
  const staleHours = last ? (Date.now() - last.getTime()) / 3600000 : null;
  const health = last === null
    ? `<span class="error">${escapeHtml(osT('adminAlertSentinelNeverRan'))}</span>`
    : (staleHours > 2
        ? `<span class="error">${escapeHtml(osT('adminAlertSentinelStale').replace('{at}', last.toLocaleString()).replace('{hours}', staleHours.toFixed(1)))}</span>`
        : `<span class="muted">${escapeHtml(osT('adminAlertSentinelOk').replace('{at}', last.toLocaleString()))}</span>`);

  const rows = (r.alerts ?? []).map((a) => `
    <tr>
      <td>${ALERT_TYPE_LABEL[a.alert_type] ?? escapeHtml(a.alert_type)}</td>
      <td>${escapeHtml(a.job_name)}</td>
      <td class="mono">${escapeHtml(String(a.detail ?? '').slice(0, 160))}</td>
      <td class="muted">${escapeHtml(new Date(a.detected_at).toLocaleString())}</td>
      <td><button class="ghost-btn" data-ack="${a.id}">${escapeHtml(osT('adminAlertAck'))}</button></td>
    </tr>`).join('');

  // 🔴 **顺手修一个我自己上一轮留下的缺陷**：这里原本写的是
  //   `class="card"`，而这份样式表里**⛔ 根本没有 .card 这个类**（只有 .panel）
  //   ⇒ 运维告警这一屏此前是**完全没有卡片样式**地裸渲染的。
  //   ⚠️ 它⛔ 不报错、⛔ 不影响功能，所以能一直活着 —— 与本轮在查的
  //   「没人看得见」是同一个家族的问题：**没有失败信号的失败**。
  el.innerHTML = `
    <div class="panel">
      <h2>${escapeHtml(osT('adminAlertHeading'))} <span class="hint">${escapeHtml(osT('adminAlertUnacked').replace('{n}', r.unackedCount ?? 0))}</span></h2>
      <p class="status">${health}</p>
      ${rows ? `<table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminAlertColType'))}</th><th>${escapeHtml(osT('adminAlertColJob'))}</th><th>${escapeHtml(osT('adminAlertColDetail'))}</th><th>${escapeHtml(osT('adminAlertColFoundAt'))}</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`
      : `<p class="muted">${escapeHtml(osT('adminAlertEmpty'))}</p>`}
      <p class="hint" style="margin-top:12px">
        ${escapeHtml(osT('adminAlertAckNote'))}
        ${escapeHtml(osT('adminAlertDedupeNote'))}
      </p>
    </div>`;

  el.querySelectorAll('[data-ack]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await callFn('sfk-admin-ops-alerts', { action: 'ack', ids: [Number(btn.dataset.ack)] });
        await renderOpsAlertsTab(el);
        renderAppTabsOnly();
      } catch (e) {
        btn.disabled = false;
        alert(osT('adminAlertAckFailed') + e.message);
      }
    });
  });
}

// 只刷新标签栏角标，⛔ 不整页重渲染（否则会把当前这一屏刷没）
// ⚠️ 原版把标签文字写死成「运维告警」⇒ 多一个带角标的标签就会被改错。
//   改成从 TABS 取 label + 复用 tabBadge()，⇒ 再加标签⛔ 不必再动这里。
function renderAppTabsOnly() {
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    const t = TABS.find((x) => x.id === btn.dataset.tab);
    if (!t) return;
    btn.innerHTML = t.label + tabBadge(t.id);
  });
}

// ⭐ 取 {zh,en} 里当前语言那条。⚠️ ⛔ 不走 `OS_L10N` —— 📌 字段名放在规格表里
//   （与类型/单位挨着）比散进一个几百条的字典更好维护，⭐ 也更⛔ 容易漏译。
function pick(o) {
  if (!o) return '';
  if (typeof o === 'function') return '';   // ⚠️ 函数形式必须走 pickNotice，⛔ 静默变空
  if (typeof o === 'string') return o;
  const lang = (typeof OS_LANG !== 'undefined') ? OS_LANG : (document.documentElement.lang || 'zh');
  return lang === 'zh' ? (o.zh ?? o.en ?? '') : (o.en ?? o.zh ?? '');
}

// 🔴 G4【四】：`notice`／`fieldNotice` 允许写成**函数** `(ctx) => ({zh, en})` ——
//   ⚠️ **文案里⛔ 不许写死配置值**：📌 那个数会随配置漂，而**⛔ 没有人会发现文案还停在旧值**。
//   ⭐ 判据：这个数字是⛔ 是我们自己能改的配置？是 ⇒ 取值；⛔ 不是（外部公开价、
//     文档编号、说明语义里的 0）⇒ 留着字面量。
function pickNotice(o, ctx) { return pick(typeof o === 'function' ? o(ctx ?? {}) : o); }

// ==================== `E1` 收费参数具名界面 ====================
// 依据：《SFK_收费参数字段规格表_D1_v1.0.md》
//
// 🔴 为什么要做这一整套：`GOV-1` 达标线① —— **裸 JSON 文本框⛔ 不算「后台可改」**，
//   那是让运营写代码。旧界面正是一个 `<textarea>` 里放 `JSON.stringify(value)`。
//
// ⭐ `D1` §〇 的核心决定：**37 个键拆成字段后全部落进 8 种类型** ⇒
//   📌 校验**按类型写一次**，每个字段只配「类型 ＋ 中文名 ＋ 单位 ＋ 影响谁」。
//   ⚠️ ⛔ 不是每键定制校验 —— 那会让这块从 2.5d 涨到 4d 以上，且⛔ 无人维护得动。

// ── 8 种类型：渲染 / 解析 / 校验，各写一次 ──
// ⚠️ **`0` 与「未设定」必须在视觉上完全区分**（`D1` §一 ／ `GOV-1` 达标线③）
//   ⇒ 📌 `null` ⇒ 灰色「未设定」标签；`0` ⇒ 就是数字 0。
//   🔴 **⛔ 不许用 `!value` 判空** —— ⭐ 那会把「佣金率 0%」显示成「未设定」。
// ══════════════════════════════════════════════════════════════════════
// 🔵 **冻结项 · 国家 → 法定货币（ISO 4217）**（`GOV-1` v2.0 具名登记）
// ══════════════════════════════════════════════════════════════════════
// ⭐ **为什么它⛔ 该配界面**：📌 `GOV-1` v2.0 的判据是「**这个参数的对错，由哪个岗位的专业判断决定？**」
//   ⇒ ⚠️ 一个国家的法定货币**⛔ 由任何岗位判断** —— 🔴 它是**事实**，出处 **ISO 4217**。
//   ⇒ ## 📌 运营要决定的是「**这个国家设⛔ 设**」，⛔ 是「它用哪种币」。
// ⚠️ 🔴 **冻结⛔ 等于写死** —— 📌 渲染时会把**库里已有的值**并进选项
//   ⇒ ⭐ 即便这张表漏了一国，也**⛔ 会悄悄丢掉**那个已经设好的币种。
// 📌 覆盖范围 ＝ `sfk_os.allowed_institution_countries` 的 9 国（东盟 10 − 缅甸）。
// 🔴 **`ORG-2` 就绪闸门要求的五项，顺序与闸门里的数组一致**
//   （`fn_org2_assert_active_readiness`：`platform_account_id`／`legal_entity`／
//    `publishable_key`／`secret_key_env`／`webhook_secret_env`）
// ⚠️ 📌 **⛔ 许在这里增删** —— 🔴 它必须与闸门**逐项对得上**，⭐ 否则界面会让人填一堆⛔ 被检查的东西，
//   或者**⛔ 让人填那个会挡住保存的**。
const PLATROW_FIELDS = [
  { path: 'platform_account_id', label: () => osT('cfgPlatformAccountId') },
  { path: 'legal_entity',        label: () => osT('cfgPlatformLegalEntity') },
  { path: 'publishable_key',     label: () => osT('cfgPlatformPublishableKey') },
  { path: 'secret_key_env',      label: () => osT('cfgPlatformSecretKeyEnv'), envName: true },
  { path: 'webhook_secret_env',  label: () => osT('cfgPlatformWebhookSecretEnv'), envName: true },
];

const CFG_ISO4217 = {
  SG: 'sgd', MY: 'myr', TH: 'thb', ID: 'idr', PH: 'php',
  VN: 'vnd', BN: 'bnd', KH: 'khr', LA: 'lak',
};

const CFG_TYPES = {
  T1: { // 金额
    unit: () => 'S$', prefix: true, input: 'number', step: '0.01',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : Number(s)),
    check: (v) => v === null ? null
      : (!Number.isFinite(v) ? 'notNumber' : v < 0 ? 'negative'
        : Math.round(v * 100) !== v * 100 ? 'tooManyDecimals' : null),
  },
  T2: { // 比例：🔴 界面按 % 显示，**存储是 0–1 的小数**
    unit: () => '%', input: 'number', step: '0.01',
    toInput: (v) => (v === null || v === undefined ? '' : String(Math.round(v * 10000) / 100)),
    parse: (s) => (s.trim() === '' ? null : Number(s) / 100),
    check: (v) => v === null ? null
      : (!Number.isFinite(v) ? 'notNumber' : (v < 0 || v > 1) ? 'ratioRange' : null),
  },
  T3: { // Token 数
    unit: () => 'Token', input: 'number', step: '1',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : Number(s)),
    check: (v) => v === null ? null
      : (!Number.isInteger(v) ? 'notInteger' : v < 0 ? 'negative' : null),
  },
  T4: { // 次 / 天 / 月
    // ⚠️ 🔴 **浏览器实测查出的缺陷**：原写 `f.unit || ''`，而 `unit` 当时是**裸中文字符串**
    //   ⇒ 📌 英文界面下会出现「Daily messages ／ **次**」这种半中半英。
    //   ⭐ SQL 与单测都发现⛔ 不了这个 —— **它只在渲染出来的那一刻才存在。**
    unit: (f) => pick(f.unit), input: 'number', step: '1',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : Number(s)),
    check: (v) => v === null ? null
      : (!Number.isInteger(v) ? 'notInteger' : v < 0 ? 'negative' : null),
  },
  T5: { // 开关
    unit: () => '', input: 'checkbox',
    toInput: (v) => v === true,
    parse: (s) => s === true || s === 'true',
    check: () => null,
  },
  T6: { // 生效日期
    unit: () => '', input: 'date',
    toInput: (v) => (v === null || v === undefined ? '' : String(v).slice(0, 10)),
    parse: (s) => (s.trim() === '' ? null : s.trim()),
    check: (v) => v === null ? null
      : (!/^\d{4}-\d{2}-\d{2}$/.test(v) || Number.isNaN(Date.parse(v)) ? 'badDate' : null),
  },
  T7: { // 选项多选：只能从固定清单里选
    unit: () => '', input: 'checklist',
    toInput: (v) => (Array.isArray(v) ? v : []),
    parse: (arr) => arr,
    check: (v, f) => !Array.isArray(v) ? 'notArray'
      : (v.some((x) => !(f.options || []).includes(x)) ? 'notInOptions' : null),
  },
  T8: { // 外部单价快照
    // ⚠️ 🔴 **浏览器实测第二次查出同一形状**：这里原本也写死中文「百万」。
    //   📌 单位是**最容易漏译**的地方 —— ⭐ 它⛔ 不在 `OS_L10N` 里，眼睛扫⛔ 不到。
    unit: () => pick({ zh: 'US$ / 百万', en: 'US$ / M' }), prefix: false, input: 'number', step: '0.01',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : Number(s)),
    check: (v) => v === null ? null
      : (!Number.isFinite(v) ? 'notNumber' : v < 0 ? 'negative' : null),
  },
  NUM: { // ⭐ `markupMultiplier` 这种「数字 ≥ 1」—— D1 §四C 单列，⛔ 属 8 种之一
    unit: (f) => pick(f.unit), input: 'number', step: '0.1',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : Number(s)),
    check: (v) => v === null ? null
      : (!Number.isFinite(v) ? 'notNumber' : v < 1 ? 'ltOne' : null),
  },
  EMAILS: { // ⭐ **收件人清单**（`TD-137` 告警送到人）
    // ## ⚠️ 🔴 它替换掉的是 `JSON_ARRAY` —— 📌 那个类型**从⛔ 无存在过**。
    // ⭐ 规格里写着 `type: 'JSON_ARRAY'`，而 `CFG_TYPES` 里⛔ 无它
    //   ⇒ 📌 渲染到这一条就会 `Cannot read properties of undefined` ——
    //   ⚠️ **但它所在的组 `O` 本来就⛔ 会渲染** ⇒ 🔴 **这个错⛔ 无人撞到过。**
    // ⇒ ## ⭐ 「规格写了」⛔ 等于「它能渲染」，📌 更⛔ 等于「它渲染对了」。
    //
    // ⚠️ 📌 **⛔ 是裸 JSON 框**：⭐ 运营看到的是「一行一个邮箱」，
    //   🔴 而**⛔ 是 `["a@b.c","d@e.f"]`** —— 那是让运营写代码（`GOV-1` 达标线①）。
    unit: () => '', input: 'text',
    toInput: (v) => (Array.isArray(v) ? v.join(', ') : (v ?? '') === '' ? '' : String(v)),
    parse: (s) => {
      const arr = s.split(/[,;\n]/).map((x) => x.trim()).filter(Boolean);
      return arr.length ? arr : null;   // 🔴 空 ⇒ `null`（**未设定**），⛔ 是 `[]`
    },
    check: (v) => v === null ? null
      : (!Array.isArray(v) ? 'notArray'
        : v.some((x) => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)) ? 'notEmail' : null),
  },
  T9: { // ⭐ **有序启停清单**（15:40 裁定 ⑤：退款原因）
    // 🔴 值形状**刻意向后兼容**：`codes` 仍是「**启用且有序**」的那一份 ——
    //   📌 三个读取方（refund-create／admin-refunds／portal）读的都是 `value.codes`
    //   ⇒ ⭐ 它们⛔ 需要任何改动：停用的原因自动⛔ 再出现，顺序直接由数组顺序决定。
    // ⚠️ 本类型**⛔ 提供新增/删除** —— 📌 显示名的真源在 `os_l10n.json`，
    //   ⭐ 界面里新增会让同一段文字两处存放（裁定原文）。
    unit: () => '', input: 'orderedToggle',
    toInput: (v) => (Array.isArray(v) ? v : []),
    parse: (arr) => arr,
    check: (v, f) => {
      if (!Array.isArray(v)) return 'notArray';
      // 🔴 界面层也拦一次「其他⛔ 不可停用」—— ⚠️ 数据库那道（trg_guard_refund_reason_codes）才是**约束**，
      //   📌 这一道只是**⛔ 让人白填一遍再被拒**。⭐ 两道都要有，理由⛔ 同。
      if (f.requiredCode && !v.includes(f.requiredCode)) return 'requiredCodeOff';
      return null;
    },
  },
  INTERVAL: { // ⭐ **时长文本**（`ops.cron_sentinel_grace` 这种存 `'10 minutes'` 的）
    // ⚠️ 📌 它们存的是 Postgres 的间隔文本，⛔ 是数字 —— 🔴 直接给个数字框会写出 `10`，
    //   ⭐ 而读取方按间隔解析 ⇒ 📌 **那一刻才报错，且是在定时任务里报**。
    // ⇒ ⭐ 界面给一个带例子的输入框，并在这里**先校验一次形状**（⛔ 让人白填一遍再被后台拒）。
    unit: () => '', input: 'text',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : s.trim()),
    check: (v) => v === null ? null
      : (/^\d+\s+(second|minute|hour|day|week)s?$/i.test(String(v)) ? null : 'badInterval'),
  },
  WORDS: { // ⭐ **词表**（`customer_service.health_keywords` 这种「一串词」）
    // 🔴 **⛔ 是裸 JSON 框** —— ⚠️ 📌 运营看到的是「用逗号或顿号分隔的词」，
    //   ⭐ ⛔ 是 `["头疼","失眠",…]`（`GOV-1` 达标线①：裸 JSON ＝ 让运营写代码）。
    // ⚠️ **⛔ 复用 `EMAILS`** —— 🔴 它会把「⛔ 是邮箱」这条错误提示挂到词表上，
    //   📌 那比⛔ 无提示更让人困惑。
    unit: () => '', input: 'text',
    toInput: (v) => (Array.isArray(v) ? v.join('、') : (v ?? '') === '' ? '' : String(v)),
    parse: (s) => {
      const arr = s.split(/[,，、;；\n]/).map((x) => x.trim()).filter(Boolean);
      return arr.length ? arr : null;   // 🔴 空 ⇒ `null`（未设定），⛔ 是 `[]`
    },
    check: (v) => v === null ? null : (!Array.isArray(v) ? 'notArray' : null),
  },
  STR: { // ⭐ 自由文本（TD-129 #10：证据的文件名或链接）—— 空 ⇒ `null`（未设定）；真正的「齐⛔ 齐」由数据库就绪闸判
    unit: () => '', input: 'text',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : s.trim()),
    check: () => null,
  },
  TEXT: { // ⭐ `model` 这种从固定清单里选一个
    unit: () => '', input: 'select',
    toInput: (v) => (v === null || v === undefined ? '' : String(v)),
    parse: (s) => (s.trim() === '' ? null : s.trim()),
    check: (v, f) => v === null ? null
      : ((f.options || []).includes(v) ? null : 'notInOptions'),
  },
  // ══════════════════════════════════════════════════════════════════
  // ⭐ `CURMAP` · **国家 → 结账货币映射**（`R21` 裁定，2026-09-27）
  // ══════════════════════════════════════════════════════════════════
  // 🔴 它与上面所有类型的**⛔ 同之处**：值的**键集合本身是变的**（`{"map":{"SG":"sgd"}}`），
  //   ⚠️ 📌 而既有类型全部靠**固定 `path`** 取值 ⇒ ⭐ 用 `markets.SG.*` 那种写死路径的办法，
  //   🔴 会在**第二个国家**出现的那天悄悄失效（`market_stripe_accounts` 今天就是这样，只有 SG）。
  // ⇒ 📌 所以本类型的行集合**来自别的键**（见渲染处），⛔ 来自这里写死的清单。
  //
  // ⚠️ **为什么⛔ 给「新增国家」按钮**：📌 能收款的国家由
  //   `sfk_os.allowed_institution_countries` 决定 ⇒ ⭐ 在这里能凭空敲一个国家码，
  //   就等于**让这张表自己长出一个市场** —— 🔴 那正是本键此前刻意⛔ 建界面的理由。
  // ══════════════════════════════════════════════════════════════════
  // ⭐ `PLATROWS` · **一行一个交易平台**（`ORG-2`，2026-09-27 裁定㊀）
  // ══════════════════════════════════════════════════════════════════
  // 🔴 与 `CURMAP` 同一形状、同一理由：**行集合来自数据，⛔ 来自写死的路径**。
  //   ⚠️ 📌 同一个键的另一半（`markets.SG.*`）用的就是写死路径 `markets.SG.…`
  //   ⇒ ## ⭐ **第二个市场出现的那天它会悄悄失效** —— 🔴 本半⛔ 重蹈。
  //
  // ⚠️ **⛔ 给「新增平台」按钮**（裁定原文：⛔ 许敲出新平台）——
  //   📌 平台是**法律实体 ＋ 税务归属**，⭐ 它⛔ 是一个可以在输入框里长出来的东西；
  //   🔴 要加新平台走合规档流程。
  PLATROWS: {
    unit: () => '', input: 'platrows',
    toInput: (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {}),
    parse: (obj) => obj,
    check: (v) => {
      if (!v || typeof v !== 'object' || Array.isArray(v)) return 'notObject';
      // ⭐ 只校验**形状**：📌 「五项齐⛔ 齐」由**数据库触发器**判
      //   （`fn_org2_assert_active_readiness` ⇒ `ORG2_PLATFORM_NOT_READY`）
      //   ⇒ 🔴 **⛔ 在这里重判一遍** —— ⚠️ 那会变成第二套判据，而两套迟早对⛔ 上。
      for (const p of Object.values(v)) {
        if (!p || typeof p !== 'object') return 'notObject';
        for (const f of PLATROW_FIELDS) {
          const x = p[f.path];
          if (x !== null && typeof x !== 'string') return 'notObject';
        }
        // 🔴 **⛔ 许把密钥本身粘进 `*_env`** —— 📌 那两列存的是**环境变量名**
        for (const f of ['secret_key_env', 'webhook_secret_env']) {
          if (typeof p[f] === 'string' && /^(sk|whsec|rk)_/.test(p[f].trim())) return 'secretValueInEnvName';
        }
      }
      return null;
    },
  },
  CURMAP: {
    unit: () => '', input: 'curmap',
    toInput: (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {}),
    parse: (obj) => obj,
    check: (v) => {
      if (!v || typeof v !== 'object' || Array.isArray(v)) return 'notObject';
      // 🔴 只校验**形状**，⛔ 校验「该⛔ 该设」—— ⚠️ 📌 那是三道闸里另外两道的事，
      //   ⭐ 在这里拦会把**三道独立的闸压成一道**（`TD-171` 迁移原文：「两者是两道独立的闸」）。
      for (const [cc, cur] of Object.entries(v)) {
        if (!/^[A-Z]{2}$/.test(cc)) return 'badCountry';
        if (typeof cur !== 'string' || !/^[a-z]{3}$/.test(cur)) return 'badCurrency';
      }
      return null;
    },
  },
};
