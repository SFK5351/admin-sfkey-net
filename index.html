// ==================== SFK OS 运维工具 ====================
// 2026-08-05补：这4个函数早就部署了，一直没有UI，只能靠人直接curl调用
// （2026-08-04审计发现的缺口）。四个工具风险等级不同——enterprise-link
// 是纯写库操作；stripe-meter-setup是幂等的一次性基础设施初始化（重复
// 点击安全，已有就直接返回已有值）；ai-rate-change-schedule和
// grace-backfill都会对生产环境的真实机构发真实通知，不是可以随便点
// 的操作，UI上用明显的警示文案标出来，不做成"一键运行"那么轻巧。
function renderSfkOsToolsTab(el) {
  el.innerHTML = `
    ${hasRole('operator') ? `
    <section class="panel">
      <h2>${escapeHtml(osT('adminOsToolEnterpriseHeading'))}</h2>
      <p class="hint">${escapeHtml(osT('adminOsToolEnterpriseHint'))}</p>
      <form id="enterpriseLinkForm" class="stack-form">
        <label>${escapeHtml(osT('adminOsToolInstitutionId'))}<input type="text" id="elInstitutionId" required /></label>
        <label>Stripe Customer ID<input type="text" id="elCustomerId" required placeholder="cus_..." /></label>
        <label>Stripe Subscription ID<input type="text" id="elSubscriptionId" required placeholder="sub_..." /></label>
        <!-- 🔴 【TD-164】只剩【周】额度一栏：monthly 列已就地标废，三个读取方全部改读 weekly。
             ⚠️ 📌 曾经短暂并存两栏（同日更早的一版）—— ⭐ 那是「读写⛔ 在同一口径」时的过渡形态。 -->
        <label>${escapeHtml(osT('adminOsToolQuotaWeekly'))}<input type="number" id="elQuotaWeekly" min="0" step="1" required /></label>
        <button type="submit">${escapeHtml(osT('adminOsToolLinkBtn'))}</button>
      </form>
      <p id="enterpriseLinkStatus" class="status"></p>
    </section>
    ` : ''}

    ${hasRole('super_admin') ? `
    <section class="panel">
      <h2>${escapeHtml(osT('adminOsToolMeterHeading'))}</h2>
      <p class="hint">${escapeHtml(osT('adminOsToolMeterHint'))}</p>
      <button type="button" id="meterSetupBtn">${escapeHtml(osT('adminOsToolRunBtn'))}</button>
      <p id="meterSetupStatus" class="status"></p>
    </section>
    ` : ''}

    ${hasRole('operator') ? `
    <section class="panel">
      <h2>${escapeHtml(osT('adminOsToolRateHeading'))}</h2>
      <p class="error">${escapeHtml(osT('adminOsToolRateWarn'))}</p>
      <form id="rateChangeForm" class="stack-form">
        <label>${escapeHtml(osT('adminOsToolRateType'))}
          <select id="rcChangeType">
            <option value="markup_multiplier">${escapeHtml(osT('adminOsToolRateMarkup'))}</option>
            <option value="model_cost_rates">${escapeHtml(osT('adminOsToolRateModelCost'))}</option>
          </select>
        </label>
        <label>${escapeHtml(osT('adminOsToolRateNewValue'))}<textarea id="rcNewValue" rows="4" required></textarea></label>
        <label>${escapeHtml(osT('adminOsToolRateEffectiveAt'))}<input type="datetime-local" id="rcEffectiveAt" required /></label>
        <button type="submit">${escapeHtml(osT('adminOsToolRateSubmit'))}</button>
      </form>
      <p id="rateChangeStatus" class="status"></p>
    </section>
    ` : ''}

    ${hasRole('super_admin') ? `
    <section class="panel">
      <h2>${escapeHtml(osT('adminOsToolGraceHeading'))}</h2>
      <p class="error">${escapeHtml(osT('adminOsToolGraceWarn'))}</p>
      <button type="button" id="graceBackfillBtn">${escapeHtml(osT('adminOsToolRunBtn'))}</button>
      <p id="graceBackfillStatus" class="status"></p>
    </section>
    ` : ''}
  `;

  document.getElementById('enterpriseLinkForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('enterpriseLinkStatus');
    statusEl.classList.remove('error');
    statusEl.textContent = osT('adminCommonSubmitting');
    try {
      await callFn('sfk-os-admin-subscription-enterprise-link', {
        institutionId: document.getElementById('elInstitutionId').value.trim(),
        stripeCustomerId: document.getElementById('elCustomerId').value.trim(),
        stripeSubscriptionId: document.getElementById('elSubscriptionId').value.trim(),
        aiWeeklyTokenQuota: Number(document.getElementById('elQuotaWeekly').value),
      });
      statusEl.textContent = osT('adminOsToolLinkedOk');
      document.getElementById('enterpriseLinkForm').reset();
    } catch (err) {
      statusEl.classList.add('error');
      statusEl.textContent = err.message;
    }
  });

  document.getElementById('meterSetupBtn')?.addEventListener('click', async () => {
    const statusEl = document.getElementById('meterSetupStatus');
    statusEl.classList.remove('error');
    statusEl.textContent = osT('adminOsToolRunning');
    try {
      const result = await callFn('sfk-os-admin-stripe-meter-setup', {});
      statusEl.textContent = result.alreadyExisted
        ? osT('adminOsToolMeterExisted').replace('{id}', result.meterId).replace('{pid}', result.meterPriceId)
        : osT('adminOsToolMeterCreated').replace('{id}', result.meterId).replace('{pid}', result.meterPriceId);
    } catch (err) {
      statusEl.classList.add('error');
      statusEl.textContent = err.message;
    }
  });

  document.getElementById('rateChangeForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('rateChangeStatus');
    statusEl.classList.remove('error');
    statusEl.textContent = osT('adminCommonSubmitting');
    try {
      let newValue;
      try {
        newValue = JSON.parse(document.getElementById('rcNewValue').value);
      } catch {
        throw new Error(osT('adminOsToolRateBadJson'));
      }
      const effectiveAtLocal = document.getElementById('rcEffectiveAt').value;
      const result = await callFn('sfk-os-admin-ai-rate-change-schedule', {
        changeType: document.getElementById('rcChangeType').value,
        newValue,
        effectiveAt: new Date(effectiveAtLocal).toISOString(),
      });
      statusEl.textContent = osT('adminOsToolRateOk')

    } catch (err) {
      statusEl.classList.add('error');
      statusEl.textContent = err.message;
    }
  });

  document.getElementById('graceBackfillBtn')?.addEventListener('click', async () => {
    if (!window.confirm(osT('adminOsToolGraceConfirm'))) return;
    const statusEl = document.getElementById('graceBackfillStatus');
    statusEl.classList.remove('error');
    statusEl.textContent = osT('adminOsToolRunning');
    try {
      const result = await callFn('sfk-os-admin-general-access-grace-backfill', {});
      statusEl.textContent = osT('adminOsToolGraceOk')
        .replace('{a}', result.backfilled).replace('{b}', result.skippedAlreadyExists)
        .replace('{c}', result.skippedAlreadySubscribed)
        + (result.notifyFailed ? osT('adminOsToolNotifyFailed').replace('{n}', result.notifyFailed) : '') + '。';
    } catch (err) {
      statusEl.classList.add('error');
      statusEl.textContent = err.message;
    }
  });
}
