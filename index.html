// ── 点号路径存取（⚠️ `path === ''` 表示 value 本身就是标量）──
function cfgGet(value, path) {
  if (!path) return value;
  return path.split('.').reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), value);
}
function cfgSet(value, path, v) {
  if (!path) return v;
  const keys = path.split('.');
  const out = JSON.parse(JSON.stringify(value ?? {}));
  let cur = out;
  for (let i = 0; i < keys.length - 1; i++) {
    if (cur[keys[i]] === null || typeof cur[keys[i]] !== 'object') cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length - 1]] = v;
  return out;
}

// 🔴 **⛔ 不写死档名／模型名** —— ⚠️ 库里有什么就渲染什么。
//   📌 写死的后果：运营在库里新增一档，界面上**看⛔ 不见它**，
//   ⭐ 而「看⛔ 不见」比「报错」更糟 —— 它⛔ 不会有任何提示。
function buildDynamicFields(spec, value) {
  if (spec.dynamic === 'bookingTiers') {
    const DEAD = ['platform_with_token', 'institution_own_with_token'];
    const dead = (t) => DEAD.includes(t)
      ? { zh: '⚠️ 预约用 Token 抵扣**未上线**，此档暂不生效', en: 'Token-offset bookings are not live; this tier has no effect yet' } : null;
    // 🔴 `FIN-5` §2-3.3：**`0` 有两种含义** ——
    //   `configured=true` ⇒ ⭐「**决定就是 0**」；`false` ⇒ 🔴「**还⛔ 没定**」。
    // ⇒ 📌 `configuredPath` 让界面把后者显示成**「未设定」而⛔ 是 0**，
    //   ⚠️ ⛔ 否则运营看到一片 0，**分⛔ 清哪些是他该去填的**。
    return Object.keys(value ?? {}).flatMap((tier) => [
      { path: `${tier}.commissionRate`, configuredPath: `${tier}.commissionConfigured`,
        policyMinPath: `${tier}.commissionPolicyMin`, policyMaxPath: `${tier}.commissionPolicyMax`,
        label: { zh: `${tier} · 佣金率`, en: `${tier} · commission` }, type: 'T2', affects: 'institution',
        readonly: DEAD.includes(tier), fieldNotice: dead(tier) },
      // 🔴 **2026-09-11 更正**：这一轴**四档一律 0，且是决定值** ——
      //   ⚠️ 它原名「引流费」，曾被改叫「点数推广费」⇒ 🔴 **那次改名已撤回**：
      //   📌 「点数推广费」是**另一件事**（专属抵扣券手续费，键 `sfk_os.points_promotion_fee_rate`），
      //   ⭐ 触发条件完全⛔ 同 —— 沿用同一个名字，早晚有人把两者当成一个。
      { path: `${tier}.acquisitionRate`,
        label: { zh: `${tier} · 平台通用奖励点数`, en: `${tier} · platform reward points` },
        affects: 'institution',
        fixedText: osT('cfgNoChargePolicy'), fieldNotice: osT('cfgNoChargeWhy') },
    ]);
  }
  if (spec.dynamic === 'modelRates') {
    return Object.keys(value ?? {}).flatMap((m) => [
      { path: `${m}.inputPerMillionUsd`, label: { zh: `${m} · 输入`, en: `${m} · input` }, type: 'T8', affects: 'institution' },
      { path: `${m}.outputPerMillionUsd`, label: { zh: `${m} · 输出`, en: `${m} · output` }, type: 'T8', affects: 'institution' },
    ]);
  }
  return spec.fields;
}

// ── 渲染一个字段的输入控件 ──
// 🔴 「未设定」与「0」必须一眼可分（`GOV-1` 达标线③）：
//   · `null` ⇒ 输入框**空** ＋ 旁边一枚灰色「未设定」标签
//   · `0`    ⇒ 输入框里就是 `0`，**⛔ 无标签**
// ⚠️ ⛔ 不许用 `!v` 判空 —— 📌 那会把「佣金率 0%」显示成「未设定」。
function cfgFieldInput(keyName, f, value, disabled, all) {
  // 🔴 **决定值字段**：⛔ 渲染输入框，⛔ 渲染「未设定」标签，⛔ 渲染政策区间。
  // ⚠️ ⛔ 不能用 `readonly` 代替 —— 📌 `readonly` 的框里仍显示 `0`，
  //   ⭐ 而运营看到 `0` 会问「这是⛔ 没设，还是设成了免费？」⇒ 🔴 **正是 `GOV-1` 达标线③要根除的歧义。**
  // ⇒ ## ⭐ 这里直接显示结论：「不收费（政策）」。
  if (f.fixedText) {
    return `
    <div class="cfg-field cfg-field-fixed" data-key="${escapeHtml(keyName)}" data-path="${escapeHtml(f.path)}" data-fixed="1">
      <div class="cfg-field-label">${escapeHtml(pick(f.label) || f.path || keyName)}</div>
      <div class="cfg-field-input"><span class="cfg-fixed-val">${escapeHtml(pick(f.fixedText))}</span></div>
      <div class="cfg-field-meta">
        ${f.affects ? `<span class="cfg-affects">${escapeHtml(osT('cfgAffects'))}${escapeHtml(pick(CFG_AFFECTS[f.affects]))}</span>` : ''}
        ${f.fieldNotice ? `<span class="cfg-notice-inline">${escapeHtml(pickNotice(f.fieldNotice, { value, all }))}</span>` : ''}
      </div>
    </div>`;
  }
  const t = CFG_TYPES[f.type];
  const raw0 = cfgGet(value, f.path);
  // 🔴 `FIN-5`：带 `configuredPath` 的字段，**⛔ 没被显式设定过 ⇒ 一律按「未设定」显示**，
  //   ⚠️ 📌 哪怕库里存的是 `0`。⭐ ⛔ 否则「占位的 0」与「决定为 0」在界面上**⛔ 无区别**。
  const notConfigured = f.configuredPath ? cfgGet(value, f.configuredPath) !== true : false;
  const isUnset = raw0 === null || raw0 === undefined || notConfigured;
  const raw = isUnset && notConfigured ? null : raw0;
  const id = `cfg_${btoa(unescape(encodeURIComponent(keyName + '|' + f.path))).replace(/[^A-Za-z0-9]/g, '')}`;
  const ro = disabled || f.readonly ? 'disabled' : '';
  let control;
  if (t.input === 'checkbox') {
    control = `<input type="checkbox" id="${id}" ${t.toInput(raw) ? 'checked' : ''} ${ro} />`;
  } else if (t.input === 'select') {
    const opts = (f.options || (isUnset ? [] : [raw])).map((o) =>
      `<option value="${escapeHtml(o)}" ${o === raw ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
    control = `<select id="${id}" ${ro}><option value="">—</option>${opts}</select>`;
  } else if (t.input === 'checklist') {
    // ⭐ T7：可选项来自**当前值本身**（`optionsFrom:'currentArray'`）——
    //   ⚠️ 📌 我们⛔ 无权凭空扩充「可得奖励的问卷项」清单：🔴 每加一项＝多发一次奖励。
    const cur = t.toInput(raw);
    control = `<div class="cfg-checklist" id="${id}">` + cur.map((o) =>
      `<label><input type="checkbox" value="${escapeHtml(o)}" checked ${ro} /> ${escapeHtml(o)}</label>`).join('') + '</div>';
  } else if (t.input === 'orderedToggle') {
    // ⭐ 全集 ＝ 启用（有序）∪ 停用；⚠️ 渲染顺序＝启用项按当前顺序在前，停用项在后。
    const enabled = t.toInput(raw);
    const disabledArr = cfgGet(value, f.disabledPath) || [];
    const all9 = [...enabled, ...disabledArr.filter((c) => !enabled.includes(c))];
    control = `<div class="cfg-ordered" id="${id}">` + all9.map((c, ix) => {
      const on = enabled.includes(c);
      // 🔴 显示名从 `os_l10n.json` 真源取；⚠️ **取⛔ 到就明说缺失**，
      //   📌 ⛔ 许回落成原始码硬塞给运营 —— ⭐ `service_not_provided` 对运营⛔ 不是一个词。
      const lk = f.labelKeyOf ? f.labelKeyOf(c) : null;
      const nm = (lk && OS_L10N[lk]) ? osT(lk) : `${c} ${osT('cfgReasonUnknownCode')}`;
      const locked = f.requiredCode === c;
      return `<div class="cfg-ord-row" data-code="${escapeHtml(c)}">
        <label><input type="checkbox" value="${escapeHtml(c)}" ${on ? 'checked' : ''} ${locked || ro ? 'disabled' : ''} /> ${escapeHtml(nm)}</label>
        ${locked ? `<span class="cfg-unset">${escapeHtml(osT('cfgReasonOtherLocked'))}</span>` : ''}
        <button type="button" class="cfg-ord-up" ${ix === 0 || ro ? 'disabled' : ''} title="${escapeHtml(osT('cfgReasonMoveUp'))}">↑</button>
        <button type="button" class="cfg-ord-down" ${ix === all9.length - 1 || ro ? 'disabled' : ''} title="${escapeHtml(osT('cfgReasonMoveDown'))}">↓</button>
      </div>`;
    }).join('') + '</div>';
  } else if (t.input === 'platrows') {
    // ══════════════════════════════════════════════════════════════
    // ⭐ 一行一个**已登记的**交易平台 —— 🔴 行集合来自 `value.platforms` 自己
    // ══════════════════════════════════════════════════════════════
    // ⚠️ 📌 **⛔ 新增按钮、⛔ 可输入的平台名** ⇒ ⭐ 平台是法律实体 ＋ 税务归属，
    //   🔴 它⛔ 是一个能在输入框里长出来的东西。
    const plats = t.toInput(raw);
    const keys = Object.keys(plats).sort();
    control = `<div class="cfg-platrows" id="${id}">` + (keys.length === 0
      ? `<div class="cfg-unset">${escapeHtml(osT('cfgPlatformNotSet'))}</div>`
      : keys.map((pk) => {
        const p0 = plats[pk] || {};
        const act = p0.status === 'active';
        return `<div class="cfg-plat-block" data-pk="${escapeHtml(pk)}">
          <div class="cfg-plat-head">
            <span class="cfg-plat-key">${escapeHtml(pk)}</span>
            <span class="${act ? 'cfg-affects' : 'cfg-notice-inline'}">${escapeHtml(
              act ? osT('cfgPlatformActiveHint') : osT('cfgPlatformPendingHint'))}</span>
          </div>` + PLATROW_FIELDS.map((f) => {
            const v0 = p0[f.path];
            // 🔴 「未设定」与空串必须一眼可分（`GOV-1` 达标线③）——
            //   ⚠️ 📌 而就绪闸门把 `null`／缺键／**空串**一律算⛔ 填 ⇒ ⭐ 界面也照这个口径显示。
            const unset = v0 === null || v0 === undefined || String(v0).trim() === '';
            return `<div class="cfg-plat-field">
              <label>${escapeHtml(f.label())}</label>

            </div>`;
          }).join('') + '</div>';
      }).join('')) + '</div>';
  } else if (t.input === 'curmap') {
    // ══════════════════════════════════════════════════════════════
    // ⭐ 一行一个国家 —— 🔴 **行集合来自【别的键】，⛔ 来自这里**
    // ══════════════════════════════════════════════════════════════
    // 📌 全集 ＝ `allowed_institution_countries`（可注册国）∪ 当前映射里已有的国家。
    // ⚠️ 为什么要并上「已有的」：🔴 某国若被移出可注册名单、而映射里还留着它，
    //   ⭐ **⛔ 显示出来就等于把它藏了** ⇒ 📌 那一行会打上「⛔ 在名单里」的标。
    const cur = t.toInput(raw);
    const allowed = (all && all['sfk_os.allowed_institution_countries']
      && all['sfk_os.allowed_institution_countries'].value
      && all['sfk_os.allowed_institution_countries'].value.countries) || [];
    const mkts = (all && all['sfk_os.market_stripe_accounts']
      && all['sfk_os.market_stripe_accounts'].value
      && all['sfk_os.market_stripe_accounts'].value.markets) || {};
    const ccs = [...new Set([...allowed, ...Object.keys(cur)])].sort();
    control = `<div class="cfg-curmap" id="${id}">` + ccs.map((cc) => {
      const v = cur[cc] || '';
      // 🔴 **币种清单是【冻结项】，⛔ 是参数**（`GOV-1` v2.0：工程／会计口径应冻结 ＋ 具名登记理由）
      //   ⭐ 出处：**ISO 4217**（一国的法定货币是事实，⛔ 是运营可以调的数）。
      //   ⚠️ 📌 仍把**库里已有的值**并进选项 —— 🔴 ⛔ 则一次渲染就会**悄悄丢掉**一个我们没预料到的币种。
      const opts = [...new Set([CFG_ISO4217[cc], v].filter(Boolean))];
      const inList = !allowed.includes(cc);
      const st = mkts[cc] && mkts[cc].status;
      return `<div class="cfg-cur-row" data-cc="${escapeHtml(cc)}">

  }
  const unit = t.unit(f);
  // ⭐ **政策区间**（创始人 2026-09-11）—— 📌 只显示，⚠️ **⛔ 在这里拦**

  //   ⇒ ⭐ 上一版 `booking_min_customer_paid_sgd` 仍写着 `policyMinPath:'channelMinPolicyMin'`
  //     —— 🔴 那个字段已在迁移 `20260913690000` 删除 ⇒ **它的政策区间此刻是死的**（我的回归）。
  //   ⇒ 新增 `policyMinFn(ctx)`／`policyMaxFn(ctx)`，与 `notice` 同形，`ctx.all` 拿得到全部键。
  const pctx = { value, all: all || {} };
  const pMin = f.policyMinFn ? f.policyMinFn(pctx) : (f.policyMinPath ? cfgGet(value, f.policyMinPath) : null);
  const pMax = f.policyMaxFn ? f.policyMaxFn(pctx) : (f.policyMaxPath ? cfgGet(value, f.policyMaxPath) : null);
  // 🔴 **⛔ 许一律按百分比格式化** —— ⚠️ 上一版写死 `x*10000 + '%'`：
  //   📌 那对 `T2`（比例）是对的，⭐ 而 `T1` 的 0.50 会显示成 **「5000%」**、`T4` 的 30 会显示成「300000%」。
  //   ⇒ ⚠️ 它一直没被发现，正是因为**唯一用到区间的那个字段恰好是死的**（见上）。
  const fmtRange = (x) => {
    if (typeof x !== 'number') return '—';

    if (f.type === 'T1') return 'S$' + x;

  const policyText = (typeof pMin === 'number' || typeof pMax === 'number')
    ? `${osT('cfgPolicyRange')}${fmtRange(pMin)} – ${fmtRange(pMax)}` : '';
  return `
    <div class="cfg-field" data-key="${escapeHtml(keyName)}" data-path="${escapeHtml(f.path)}" data-type="${f.type}" data-id="${id}"${f.options ? ` data-options="${escapeHtml(JSON.stringify(f.options))}"` : ''}${f.configuredPath ? ` data-configured-path="${escapeHtml(f.configuredPath)}"` : ''}${f.disabledPath ? ` data-disabled-path="${escapeHtml(f.disabledPath)}"` : ''}${t.input === 'platrows' ? ` data-base="${escapeHtml(JSON.stringify(t.toInput(raw)))}"` : ''}${typeof pMin === 'number' ? ` data-policy-min="${pMin}"` : ''}${typeof pMax === 'number' ? ` data-policy-max="${pMax}"` : ''}>
      <div class="cfg-field-label">${escapeHtml(pick(f.label) || f.path || keyName)}</div>
      <div class="cfg-field-input">
        ${t.prefix ? `<span class="cfg-unit">${escapeHtml(unit)}</span>` : ''}
        ${control}
        ${!t.prefix && unit ? `<span class="cfg-unit">${escapeHtml(unit)}</span>` : ''}
        ${isUnset ? `<span class="cfg-unset">${escapeHtml(osT('cfgUnset'))}</span>` : ''}
      </div>
      <div class="cfg-field-meta">
        ${policyText ? `<span class="cfg-policy">${escapeHtml(policyText)}</span>` : ''}
        ${f.affects ? `<span class="cfg-affects">${escapeHtml(osT('cfgAffects'))}${escapeHtml(pick(CFG_AFFECTS[f.affects]))}</span>` : ''}
        ${f.fieldNotice ? `<span class="cfg-notice-inline">${escapeHtml(pickNotice(f.fieldNotice, { value, all }))}</span>` : ''}
      </div>
      <div class="cfg-field-err"></div>
    </div>`;
}

// ── `T9` 排序：上移／下移（**事件委托**，⛔ 每行绑一个）──
// ⚠️ ⛔ 用「渲染时逐行 addEventListener」：📌 每次重排都要重绑，⭐ 而漏绑一次是**静默**的
//   —— 🔴 按钮还在，点了⛔ 没反应，而⛔ 无任何报错。
// ⚠️ 加 `typeof` 守卫**⛔ 是为了好看** —— 📌 离线单测的 `document` 桩⛔ 无 `addEventListener`，
//   ⛔ 守的话整个脚本在测试里**加载就炸** ⇒ ⭐ 而在浏览器里它永远存在，守卫永远⛔ 不生效。
// 🔴 ⛔ 许只加守卫就完事：那会让这段代码变成**测⛔ 到的代码** ——
//   ⇒ 📌 已在 `e1_config_ui.test.mjs` 的桩里补上 `addEventListener`，并断言它真的注册了。
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.cfg-ord-up, .cfg-ord-down');
  if (!btn || btn.disabled) return;
  const row = btn.closest('.cfg-ord-row');
  const up = btn.classList.contains('cfg-ord-up');
  const sib = up ? row.previousElementSibling : row.nextElementSibling;
  if (!sib || !sib.classList.contains('cfg-ord-row')) return;
  if (up) row.parentNode.insertBefore(row, sib);
  else row.parentNode.insertBefore(sib, row);
  // ⭐ 重排后**重算首尾禁用态** —— 📌 ⛔ 则第一行的「↑」会一直可点。
  const rows = [...row.parentNode.querySelectorAll('.cfg-ord-row')];
  rows.forEach((r, i) => {
    const u = r.querySelector('.cfg-ord-up'); const dn = r.querySelector('.cfg-ord-down');
    if (u) u.disabled = (i === 0);
    if (dn) dn.disabled = (i === rows.length - 1);
  });
});
}

/** ⭐ 从界面读回一个字段的值；返回 `{ v, err }`。⚠️ 空 ⇒ `null`（**未设定**），⛔ 是 `0`。 */
function cfgReadField(el) {
  const f = { type: el.dataset.type, path: el.dataset.path };
  const t = CFG_TYPES[f.type];
  const node = el.querySelector(`#${CSS.escape(el.dataset.id)}`);
  let v;
  if (t.input === 'checkbox') v = t.parse(node.checked);
  else if (t.input === 'orderedToggle') {
    // ⭐ 只读回**启用**的那一份（按 DOM 顺序）—— 📌 那正是 `value.codes` 的语义。
    //   ⚠️ 停用的那一份由 `cfgCollectOrderedDisabled()` 单独收，写进 `disabledPath`。
    v = t.parse([...node.querySelectorAll('.cfg-ord-row')]
      .filter((r) => r.querySelector('input[type=checkbox]').checked)
      .map((r) => r.dataset.code));
  }
  else if (t.input === 'checklist') {
    v = t.parse([...node.querySelectorAll('input[type=checkbox]')].filter((c) => c.checked).map((c) => c.value));
  } else if (t.input === 'platrows') {
    // ⭐ 🔴 **⛔ 许丢掉 `status` 等⛔ 在本界面上的字段** —— ⚠️ 📌 本界面只管那五项，
    //   而 `platforms.<key>` 里还有 `status`（由「市场开通收款」那张卡片翻）。
    //   ⇒ ## ⭐ **读回时必须【合并】回原值，⛔ 是整块替换。**
    //   🔴 ⛔ 则一次保存就会**悄悄把平台的 `status` 抹掉** —— 📌 而那正是「已开通」这件事本身。
    const base = JSON.parse(el.dataset.base || '{}');
    const o = {};
    node.querySelectorAll('.cfg-plat-block').forEach((b) => {
      const pk = b.dataset.pk;
      const merged = { ...(base[pk] || {}) };
      b.querySelectorAll('.cfg-plat-in').forEach((inp) => {
        const txt = inp.value.trim();
        merged[inp.dataset.f] = txt === '' ? null : txt;   // ⭐ 空 ⇒ null（未设定），⛔ 是空串
      });
      o[pk] = merged;
    });
    v = t.parse(o);
  } else if (t.input === 'curmap') {
    // ⭐ 只收**选了币种**的行 —— 🔴 空 ＝ 未设定 ⇒ 📌 那个国家**⛔ 出现在映射里**，
    //   ⚠️ 而⛔ 是写成 `""`／`null`：`booking_currency.ts` 的判据是「查⛔ 到 ⇒ 拒绝收款」，
    //   ⇒ ## 📌 留一个空字符串会让它变成「查到了、但是空的」—— 那是另一条⛔ 无人写过的分支。
    const o = {};
    node.querySelectorAll('.cfg-cur-row').forEach((r) => {
      const cc = r.dataset.cc; const sel = r.querySelector('.cfg-cur-sel').value.trim();
      if (sel) o[cc] = sel;
    });
    v = t.parse(o);
  } else v = t.parse(node.value);
  // 🔴 2026-09-22 修（TD-129 #10 顺带查出）：原写 `options: undefined` ⇒ 下拉类（TEXT）字段校验永远报「只能从清单里选」，
  //   ⚠️ 即选了清单里的值也存⛔ 了（告警分级「默认级别」那一格同样中招）。⇒ 选项随字段渲染进 data-options，这里读回来校验。
  const spec = { ...f, options: el.dataset.options ? JSON.parse(el.dataset.options) : undefined };
  const errCode = t.check(v, spec);
  return { v, err: errCode ? pick(CFG_ERR[errCode]) : null };
}

// ==================== `E1` 收入参数界面 ====================
async function renderRevenueConfigSection(host, configs, myPerms) {
  const byKey = Object.fromEntries(configs.map((c) => [c.key, c]));
  const canPropose = myPerms.permissions.includes('config.revenue.propose');
  // 🔴 TD-301：独任负责人例外 —— 只在「在职负责人恰 1 人且是本人」时显示（⛔ 安全边界，服务端另核）
  const canSole = myPerms.solePrincipal === true && myPerms.permissions.includes('config.compliance.approve');

  // 🔴 **覆盖率自检** —— ⚠️ 这一段⛔ 不是装饰
  // 📌 `GOV-1` 完成判据①要求**全部** revenue 键都有具名输入框。
  //   ⭐ 若某个键**⛔ 没配规格**，⛔ 不许静默退回 JSON 框 ——
  //   🔴 那样界面看起来是好的，而达标线①**已经悄悄不成立了**。
  const revenueKeys = configs.filter((c) => c.revenue_class === 'revenue').map((c) => c.key);
  const uncovered = revenueKeys.filter((k) => !CFG_SPEC[k] && !CFG_READONLY[k] && !CFG_EXCLUDED[k]);

  // 🔴 **⛔ 许在这里手写组名** —— ⚠️ 📌 上一版写死 `['A','B','C','D']`，
  //   ⭐ 而 `CFG_SPEC` 里有 `F`／`O` 两组 ⇒ 那 6 条规格永远⛔ 会渲染。
  //   ⇒ ## 📌 **从 `CFG_GROUPS` 取键** ⇒ ⭐ 加一组只需要改一处。
  const groups = Object.keys(CFG_GROUPS).map((g) => {
    const keys = Object.keys(CFG_SPEC).filter((k) => CFG_SPEC[k].group === g && byKey[k]);
    if (!keys.length) return '';
    return `
      <section class="panel">
        <h2>${escapeHtml(pick(CFG_GROUPS[g]))}</h2>
        ${g === 'B' ? `<p class="cfg-notice">${escapeHtml(osT('cfgTokenRateNotice'))}</p>` : ''}
        ${keys.map((k) => {
          const spec = CFG_SPEC[k];
          const cfg = byKey[k];
          const fields = spec.dynamic ? buildDynamicFields(spec, cfg.value) : spec.fields;
          // ⭐ 全部字段只读 ⇒ ⛔ 给提交按钮（点了也只会报「没有改动」）
          const allRo = fields.length > 0 && fields.every((f) => f.readonly);
          const soleHere = canSole && spec.group === 'D' && !allRo;
          return `
            <div class="cfg-card" data-card="${escapeHtml(k)}">
              <div class="cfg-card-head">
                <h3>${escapeHtml(pick(spec.label))}</h3>
                <code class="muted">${escapeHtml(k)}</code>
              </div>
              ${spec.notice ? `<p class="cfg-notice">${escapeHtml(pickNotice(spec.notice, { value: cfg.value, all: byKey }))}</p>` : ''}
              <div class="cfg-fields">${fields.map((f) => cfgFieldInput(k, f, cfg.value, !canPropose, byKey)).join('')}</div>
              ${allRo ? `<p class="hint">${escapeHtml(osT('cfgAllReadonlyHint'))}</p>` : (canPropose || soleHere) ? `
                ${soleHere ? `<p class="cfg-notice">${escapeHtml(osT('cfgSoleApplyHint'))}</p>` : ''}
                <div class="cfg-card-actions">
                  <input type="text" class="cfg-reason" placeholder="${escapeHtml(osT('cfgReasonPh'))}" />
                  ${canPropose ? `<button class="cfg-submit" data-submit="${escapeHtml(k)}">${escapeHtml(osT('cfgSubmitRequest'))}</button>` : ''}
                  ${soleHere ? `<button class="cfg-submit ghost-btn" data-sole-apply="${escapeHtml(k)}">${escapeHtml(osT('cfgSoleApplyBtn'))}</button>` : ''}
                  <span class="status cfg-status"></span>
                </div>` : `<p class="hint">${escapeHtml(osT('cfgNeedProposePerm'))}</p>`}
              <details class="cfg-raw"><summary>${escapeHtml(osT('cfgRawJson'))}</summary><pre class="mono">${escapeHtml(JSON.stringify(cfg.value, null, 2))}</pre></details>
            </div>`;
        }).join('')}
      </section>`;
  }).join('');

  if (!host.isConnected) return;
  const roKeys = Object.keys(CFG_READONLY).filter((k) => byKey[k]);
  host.innerHTML = `
    ${uncovered.length ? `
      <section class="panel cfg-gap">
        <h2>${escapeHtml(osT('cfgUncoveredHeading'))}</h2>
        <p>${escapeHtml(osT('cfgUncoveredBody'))}</p>
        <ul>${uncovered.map((k) => `<li class="mono">${escapeHtml(k)}</li>`).join('')}</ul>
      </section>` : ''}
    ${groups}
    ${roKeys.length ? `
      <section class="panel">
        <h2>${escapeHtml(osT('cfgReadonlyHeading'))}</h2>
        <p class="hint">${escapeHtml(osT('cfgReadonlyHint'))}</p>
        <table class="data-table">
          <tbody>${roKeys.map((k) => `
            <tr><td class="mono">${escapeHtml(k)}</td>
                <td class="mono">${escapeHtml(JSON.stringify(byKey[k].value))}</td>
                <td>${escapeHtml(pick(CFG_READONLY[k]))}</td></tr>`).join('')}
          </tbody>
        </table>
      </section>` : ''}
  `;

  if (!canPropose && !canSole) return;
  host.querySelectorAll('[data-submit],[data-sole-apply]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const sole = btn.dataset.soleApply != null;
      const key = sole ? btn.dataset.soleApply : btn.dataset.submit;
      const card = host.querySelector(`[data-card="${CSS.escape(key)}"]`);
      const statusEl = card.querySelector('.cfg-status');
      const reason = card.querySelector('.cfg-reason').value.trim();
      statusEl.classList.remove('error');
      if (!reason) { statusEl.classList.add('error'); statusEl.textContent = osT('cfgReasonRequired'); return; }

      // ⭐ 从**当前库值**出发逐字段覆盖 ⇒ 📌 ⛔ 不碰规格表里⛔ 没列的字段
      //   （⚠️ 例如 `referral_subscription_commission_rate` 里的 `note`）
      let newValue = JSON.parse(JSON.stringify(byKey[key].value));
      let changed = false; let bad = false;
      const outOfPolicy = [];
      card.querySelectorAll('.cfg-field').forEach((el) => {
        const errBox = el.querySelector('.cfg-field-err');
        errBox.textContent = '';
        const node = el.querySelector(`#${CSS.escape(el.dataset.id)}`);
        if (!node || node.disabled) return;
        const { v, err } = cfgReadField(el);
        if (err) { errBox.textContent = err; bad = true; return; }
        const cfgPath = el.dataset.configuredPath || '';
        // 🔴 `FIN-5`：带 `configuredPath` 的字段，**留空 ⇒ 整项⛔ 不动**。
        //   ⚠️ ⛔ 否则「运营只改了 A 格」会把 B 格写成 `rate=null`，
        //   📌 而那比原来的「占位 0」**更糟** —— ⭐ 它把一个已知状态变成了⛔ 无法解释的 null。
        if (cfgPath && v === null) return;
        const old = cfgGet(byKey[key].value, el.dataset.path);
        if (JSON.stringify(v) !== JSON.stringify(old ?? null)) changed = true;
        newValue = cfgSet(newValue, el.dataset.path, v);
        // 🔴 `T9`：启用那一份写进 `path`，**停用那一份必须同时写进 `disabledPath`** ——
        //   ⚠️ ⛔ 写的话，被停用的原因会从 `codes ∪ disabled` 里**整个消失**
        //   ⇒ 📌 而数据库那道不变式（历史引用过的⛔ 许消失）会把整次保存打回，
        //   ⭐ 运营看到的是一句看⛔ 懂的 `REFUND_REASON_STILL_REFERENCED`。
        if (el.dataset.disabledPath) {
          const node9 = el.querySelector(`#${CSS.escape(el.dataset.id)}`);
          const off = [...node9.querySelectorAll('.cfg-ord-row')]
            .filter((r) => !r.querySelector('input[type=checkbox]').checked)
            .map((r) => r.dataset.code);
          newValue = cfgSet(newValue, el.dataset.disabledPath, off);
        }
        // ⭐ 记下超出政策区间的项（⚠️ 📌 只记，⛔ 在这里 return）
        const pmin = el.dataset.policyMin != null ? Number(el.dataset.policyMin) : null;
        const pmax = el.dataset.policyMax != null ? Number(el.dataset.policyMax) : null;
        if (typeof v === 'number' && (pmin != null || pmax != null)
            && ((pmin != null && v < pmin) || (pmax != null && v > pmax))) {
          outOfPolicy.push({
            label: el.querySelector('.cfg-field-label')?.textContent || el.dataset.path,
            val: Math.round(v * 10000) / 100,
            min: pmin != null ? Math.round(pmin * 10000) / 100 : '—',
            max: pmax != null ? Math.round(pmax * 10000) / 100 : '—',
          });
        }
        // ⭐ **运营保存一次即置 `configured = true`** —— 📌 哪怕他填的就是 0：
        //   🔴 那正是「决定为 0」与「还⛔ 没定」的分界，⚠️ 而这个动作就是那条分界线。
        if (cfgPath && cfgGet(byKey[key].value, cfgPath) !== true) {
          newValue = cfgSet(newValue, cfgPath, true);
          changed = true;
        }
      });
      if (bad) { statusEl.classList.add('error'); statusEl.textContent = osT('cfgFixErrors'); return; }
      if (!changed) { statusEl.classList.add('error'); statusEl.textContent = osT('cfgNoChange'); return; }

      // 🔴 **超出政策区间：强提示，⛔ 硬拦**（创始人 2026-09-11）
      // ⚠️ 📌 硬拦会在真实业务需要破例时**把人逼去改代码**；
      //   ⭐ 「强提示 ＋ 核准人红色高亮」既挡得住手滑，又留得下破例的痕迹。
      if (outOfPolicy.length > 0) {
        const msg = osT('cfgOutOfPolicyConfirm').replace('{list}',
          outOfPolicy.map((o) => osT('cfgOutOfPolicyItem')
            .replace('{label}', o.label).replace('{val}', o.val)
            .replace('{min}', o.min).replace('{max}', o.max)).join('\n'));
        if (!window.confirm(msg)) { statusEl.textContent = ''; return; }
      }

      // 🔴 TD-301：独任负责人例外 —— 再确认一次，写明这是例外、会留痕＋P1＋待独立复核
      if (sole) {
        if (!window.confirm(osT('cfgSoleApplyConfirm'))) { statusEl.textContent = ''; return; }
        statusEl.textContent = osT('adminCommonSubmitting');
        try {
          await callFn('sfk-admin-config-update', { action: 'compliance_sole_apply', key, newValue, reason });
          statusEl.classList.remove('error');
          statusEl.textContent = osT('cfgSoleApplied');
        } catch (e) {
          statusEl.classList.add('error');
          statusEl.textContent = e.message;
        }
        return;
      }

      statusEl.textContent = osT('adminCommonSubmitting');
      try {
        // 🔴 收入档**⛔ 不直接写** ⇒ 提交申请，等财务岗核准（`TD-73(d)`）
        const r = await callFn('sfk-admin-config-update', { action: 'submit', key, newValue, reason });
        const res = r.result || {};
        statusEl.classList.remove('error');
        statusEl.textContent = osT('cfgSubmitted').replace('{id}', String(res.request_id || '').slice(0, 8));
      } catch (e) {
        statusEl.classList.add('error');
        statusEl.textContent = e.message;
      }
    });
  });
}

// ==================== `E2` 审批 ／ 我的申请 ／ 授岗 ====================

/**
 * 🔴 **高亮规则**（`D1` §二①）—— ⭐「让第二双眼睛看见小数点」的落地。
 * 触发条件（任一）：
 *   ① 变动**超过原值 50%**  ② 从 **0 ／ 未设定** 变成有值
 * ⚠️ **50% 是设计建议值，不是收入参数本身**（`D1` 原文），创始人可改。
 * ⇒ 它拦的是**多打一个 0** 这一类 —— ⭐ 那种错不会被「看起来合理」筛掉。
 */
const CFG_HIGHLIGHT_RATIO = 0.5;
function cfgIsBigChange(oldV, newV) {
  const wasBlank = oldV === null || oldV === undefined || oldV === 0;
  const nowHas = newV !== null && newV !== undefined && newV !== 0;
  if (wasBlank && nowHas) return true;              // ② 0 ／ 未设定 ⇒ 有值
  // ── ③ **有值 ⇒ 未设定**（✅ **设计窗口 2026-09-11 已采纳，正式并入 `D1` §二①**）──
  // ⚠️ 理由：按 `E3`，一个字段被清成「未设定」⇒ 📌 **读取方会响亮失败**
  //   ⇒ ⭐ 那⛔ 不是「小改动」，🔴 **它是能把一条收费路径直接打停的改动。**
  // ⇒ 📌 本条**只会多点亮，⛔ 不会少点亮** ⇒ ⚠️ 所以它⛔ 可能削弱 `D1` 的规则。
  if (!wasBlank && (newV === null || newV === undefined)) return true;
  if (typeof oldV !== 'number' || typeof newV !== 'number') return false;
  if (oldV === 0) return newV !== 0;
  return Math.abs(newV - oldV) / Math.abs(oldV) > CFG_HIGHLIGHT_RATIO;  // ① 超 50%
}

function cfgFmt(v, type) {
  if (v === null || v === undefined) return `<span class="cfg-unset">${escapeHtml(osT('cfgUnset'))}</span>`;
  if (typeof v === 'boolean') return v ? '✔' : '✘';
  if (Array.isArray(v)) return escapeHtml(v.join('、'));
  if (type === 'T2' && typeof v === 'number') return escapeHtml(String(Math.round(v * 10000) / 100)) + ' %';
  return escapeHtml(String(v));
}

/** ⭐ 逐字段「旧值 → 新值」。⚠️ 只列**真的变了**的字段 —— 全列出来等于没列。 */
function cfgDiffRows(key, oldV, newV) {
  const spec = CFG_SPEC[key];
  const fields = spec ? (spec.dynamic ? buildDynamicFields(spec, newV) : spec.fields) : null;
  const rows = [];
  if (fields) {
    fields.forEach((f) => {
      const a = cfgGet(oldV, f.path); const b = cfgGet(newV, f.path);
      if (JSON.stringify(a ?? null) === JSON.stringify(b ?? null)) return;
      // 🔴 **超出政策区间 ⇒ 核准人必须看见**（创始人 2026-09-11）
      // ⚠️ 📌 提交端只是「强提示」，⭐ **真正的第二双眼睛在这里**。
      const pMin = f.policyMinPath ? cfgGet(newV, f.policyMinPath) : null;
      const pMax = f.policyMaxPath ? cfgGet(newV, f.policyMaxPath) : null;
      const outOfPolicy = typeof b === 'number'
        && ((typeof pMin === 'number' && b < pMin) || (typeof pMax === 'number' && b > pMax));
      rows.push({
        label: pick(f.label) || f.path, type: f.type, a, b,
        affects: f.affects, hot: cfgIsBigChange(a, b) || outOfPolicy,
        outOfPolicy, policyMin: pMin, policyMax: pMax,
      });
    });
  }
  // 🔴 **兜底：规格表⛔ 没覆盖到的差异也要列出来** ——
  // ⚠️ ⛔ 否则审批页会显示「⛔ 无变化」，而值其实变了 ⇒ 📌 那是最坏的一种界面。
  if (!rows.length && JSON.stringify(oldV) !== JSON.stringify(newV)) {
    rows.push({ label: key, type: null, a: JSON.stringify(oldV), b: JSON.stringify(newV), affects: null, hot: true, raw: true });
  }
  return rows;
}

// 🔴 TD-126：主体代码 → 显示名（由 list_requests／bootstrap 带回；取⛔ 到时退回代码本身）
let CFG_ENTITY_NAMES = {};
function cfgEntityName(code) { return pick(CFG_ENTITY_NAMES[code]) || code; }

function cfgReqCard(r, emails, mode) {
  const spec = CFG_SPEC[r.config_key];
  const rows = cfgDiffRows(r.config_key, r.old_value, r.new_value);
  const who = emails[r.requested_by] || r.requested_by;
  return `
    <div class="cfg-card" data-req="${escapeHtml(r.id)}">

// 🔴 `TD-108`：`prefetched` 由 `renderConfigTab` 的一次 bootstrap 带进来 ⇒ ⭐ **⛔ 再单独发一次请求**。
//   ⚠️ ⛔ 不传时仍会自己去取 —— 📌 审批动作之后只刷新**这一块**，⭐ 那时⛔ 该把整页数据再拉一遍。
async function renderGovernanceSections(host, myPerms, prefetched) {
  let d = prefetched;
  if (!d) {
    try {
      d = await callFn('sfk-admin-config-update', { action: 'list_requests' });
    } catch (e) {
      host.innerHTML = `<section class="panel"><p class="error">${escapeHtml(e.message)}</p></section>`;
      return;
    }
  }
  // ⭐ 角标用**同一份数据**更新 ⇒ 📌 ⛔ 再为它单独发一次 `list_requests`
  applyApprovalBadge(d);
  // ⚠️ `await` 之后宿主可能已被替换 ⇒ 📌 写进**脱离文档的节点**＝静默失败
  if (!host.isConnected) return;
  const emails = d.emails || {};
  CFG_ENTITY_NAMES = d.entities || {};
  host.innerHTML = `
    ${d.canApprove ? `
      <section class="panel">
        <h2>${escapeHtml(osT('cfgPendingHeading'))}${d.pending.length ? ` <span class="ops-badge">${d.pending.length}</span>` : ''}</h2>
        ${d.pending.length ? d.pending.map((r) => cfgReqCard(r, emails, 'approve')).join('')
          : `<p class="muted">${escapeHtml(osT('cfgNoPending'))}</p>`}
      </section>` : ''}
    ${d.canApprove && d.breakGlass.length ? `
      <section class="panel cfg-gap">
        <h2>${escapeHtml(osT('cfgPostReviewHeading'))} <span class="ops-badge">${d.breakGlass.length}</span></h2>
        ${d.breakGlass.map((r) => cfgReqCard(r, emails, 'postreview')).join('')}
      </section>` : ''}
    <section class="panel">
      <h2>${escapeHtml(osT('cfgMineHeading'))}</h2>
      ${d.mine.length ? d.mine.map((r) => cfgReqCard(r, emails, 'mine')).join('')
        : `<p class="muted">${escapeHtml(osT('cfgNoMine'))}</p>`}
    </section>`;

  const act = async (btn, payload, okKey) => {
    const card = btn.closest('.cfg-card');
    const statusEl = card.querySelector('.cfg-status');
    statusEl.classList.remove('error');
    statusEl.textContent = osT('adminCommonSubmitting');
    try {
      const r = await callFn('sfk-admin-config-update', payload);
      // 🔴 **快照过期⛔ 不是异常，是返回值** —— ⚠️ 见 `20260913130000` 文件头：
      //   📌 那条请求要被置成 `cancelled` **并留痕**，所以 RPC ⛔ 不抛、而是返回 `ok:false`。
      //   ⇒ ⭐ 这里必须**照样当失败处理**，⛔ 不能因为 HTTP 200 就报成功。
      if (r.result && r.result.ok === false) {
        statusEl.classList.add('error');
        statusEl.textContent = r.result.error === 'CCR_STALE_SNAPSHOT'
          ? osT('cfgStaleHint') : (r.result.hint || r.result.error);
        return;
      }
      statusEl.textContent = osT(okKey);
      // ⭐ 重取这一块即可 —— 📌 它内部会用同一份数据把角标一起更新（`TD-108`）
      await renderGovernanceSections(host, myPerms);
    } catch (e) {
      statusEl.classList.add('error');
      statusEl.textContent = e.message;
    }
  };

  host.querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', () =>
    act(b, { action: 'approve', requestId: b.dataset.approve, note: b.closest('.cfg-card').querySelector('.cfg-note').value.trim() || null }, 'cfgApproved')));
  host.querySelectorAll('[data-reject]').forEach((b) => b.addEventListener('click', () => {
    // 🔴 驳回**理由必填**（`D2` §三）—— ⚠️ ⛔ 无理由的驳回，提出人⛔ 无从改起
    const note = b.closest('.cfg-card').querySelector('.cfg-note').value.trim();
    const statusEl = b.closest('.cfg-card').querySelector('.cfg-status');
    if (!note) { statusEl.classList.add('error'); statusEl.textContent = osT('cfgRejectNeedsNote'); return; }
    act(b, { action: 'reject', requestId: b.dataset.reject, note }, 'cfgRejected');
  }));
  host.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () =>
    act(b, { action: 'cancel', requestId: b.dataset.cancel }, 'cfgCancelled')));
  host.querySelectorAll('[data-postreview]').forEach((b) => b.addEventListener('click', () => {
    const note = b.closest('.cfg-card').querySelector('.cfg-note').value.trim();
    const statusEl = b.closest('.cfg-card').querySelector('.cfg-status');
    if (!note) { statusEl.classList.add('error'); statusEl.textContent = osT('cfgPostReviewNeedsNote'); return; }
    act(b, { action: 'post_review', requestId: b.dataset.postreview, note }, 'cfgPostReviewed');
  }));
}

// ==================== 授岗（`E0` ／ `D0`）====================
async function renderPositionsSection(host, prefetched) {
  let d = prefetched;
  if (!d) {
    try { d = await callFn('sfk-admin-config-update', { action: 'list_positions' }); }
    catch (e) { host.innerHTML = `<section class="panel"><p class="error">${escapeHtml(e.message)}</p></section>`; return; }
  }
  if (!host.isConnected) return;
  if (!d.canGrant) { host.innerHTML = ''; return; }

  const heldBy = {};
  (d.held || []).forEach((h) => { (heldBy[h.admin_user_id] ||= []).push(h.position_code); });
  // 🔴 TD-126 授岗带主体：同一岗位可在多家公司各持一条 ⇒ 显示与撤销都按「岗位 · 主体」
  const heldRows = {};
  (d.held || []).forEach((h) => { (heldRows[h.admin_user_id] ||= []).push(h); });
  const ents = d.entities || [];
  const entName = (code) => { const e = ents.find((x) => x.code === code); return e ? pick({ zh: e.display_name_zh, en: e.display_name_en }) : code; };
  // ⭐ 只列该岗允许、且此人在那家公司还⛔ 持这个岗的主体 ⇒ ⛔ 让人点一个必然失败的组合
  const entList = (pos, adminId) => {
    const types = (d.scopes || []).filter((s) => s.position_code === pos).map((s) => s.entity_type);
    const heldHere = (heldRows[adminId] || []).filter((r) => r.position_code === pos).map((r) => r.entity_code);
    return ents.filter((e) => types.includes(e.entity_type) && !heldHere.includes(e.code));
  };
  const entOptions = (pos, adminId) => entList(pos, adminId)
    .map((e) => `<option value="${escapeHtml(e.code)}">${escapeHtml(entName(e.code))}</option>`).join('');
  const grantable = (adminId) => (d.positions || []).filter((p) => entList(p.code, adminId).length);
  // 🔴 `TD-127 G-b`：可选核准人 ＝ **在任负责人**。
  //   ⚠️ 必须同时满足「持 principal」**和**「账号启用」—— 📌 `H4`（停用即撤权）之后，
  //   ⭐ 一个停用账号即使名单上还挂着岗，判权也会回 false
  //   ⇒ 🔴 把它列进下拉，只会让运营选一个**注定被服务端拒掉**的人。
  const principals = (d.admins || [])
    .filter((a) => a.is_active && (heldBy[a.id] || []).includes('principal'));
  const posName = (c) => {
    const p = (d.positions || []).find((x) => x.code === c);
    return p ? pick({ zh: p.name_zh, en: p.name_en }) : c;
  };

  host.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('cfgPositionsHeading'))}</h2>
      <p class="cfg-notice">${escapeHtml(osT('cfgPositionsGov2Gap'))}</p>
      <table class="data-table">
        <thead><tr><th>${escapeHtml(osT('cfgColAdmin'))}</th><th>${escapeHtml(osT('cfgColPositions'))}</th><th></th></tr></thead>
        <tbody>${(d.admins || []).map((a) => `
          <tr>
            <td>${escapeHtml(a.email)}${a.is_active ? '' : ` <span class="badge badge-suspended">${escapeHtml(osT('cfgInactive'))}</span>`}</td>
            <td>${(heldRows[a.id] || []).map((r) =>
              `<span class="badge badge-approved">${escapeHtml(posName(r.position_code))} · ${escapeHtml(entName(r.entity_code))} <button class="link-btn" data-revoke="${escapeHtml(a.id)}|${escapeHtml(r.position_code)}|${escapeHtml(r.entity_code)}">×</button></span>`).join(' ')
              || `<span class="muted">—</span>`}</td>
            <td>
              <select data-grantsel="${escapeHtml(a.id)}">
                ${grantable(a.id).map((p) => `<option value="${escapeHtml(p.code)}">${escapeHtml(pick({ zh: p.name_zh, en: p.name_en }))}</option>`).join('')}
              </select>
              <select data-grantent="${escapeHtml(a.id)}" aria-label="${escapeHtml(osT('cfgGrantEntity'))}">${entOptions(grantable(a.id)[0]?.code, a.id)}</select>
              <button data-grant="${escapeHtml(a.id)}">${escapeHtml(osT('cfgGrant'))}</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      <!-- 🔴🔴 \`TD-127 G-e\`（21:10 裁定）：**核准人下拉已撤**。
           ⚠️ 它让**执行人代填核准人** —— 📌 而被点名的那个负责人⛔ 不知情、⛔ 不操作、⛔ 不留痕。
           ⇒ ⭐ 服务端已封（\`TWO_STEP_APPROVAL_REQUIRED\`）；界面留着只会让人白填一遍。
           ⇒ 🔴 两步审批见 \`TD-128\`（依赖 \`TD-126 P1\` 的公司表）。 -->
      <p class="cfg-notice">${escapeHtml(osT('cfgTwoStepPending'))}</p>
      <p id="posStatus" class="status"></p>
    </section>`;

  // 🔴 `TD-127 G-e`：原来这里有一个 `approverId()` —— **已撤**。
  //   ⚠️ ⛔ 是「界面简化」：📌 那个下拉让执行人代填核准人，
  //   ⭐ 而那正是 `GOV-2`「权力必须受到监督制约」要防的形状。

  const run = async (payload) => {
    const st = document.getElementById('posStatus');
    st.classList.remove('error'); st.textContent = osT('adminCommonSubmitting');
    const reason = prompt(osT('cfgPositionReason'));
    if (!reason) { st.textContent = ''; return; }
    try {
      await callFn('sfk-admin-config-update', { ...payload, reason });
      await renderPositionsSection(host);
    } catch (e) { st.classList.add('error'); st.textContent = e.message; }
  };
  // ⭐ 选岗位时只列该岗允许的主体（服务端同样校验，界面只是⛔ 让人选注定被拒的组合）
  host.querySelectorAll('[data-grantsel]').forEach((sel) => sel.addEventListener('change', () => {
    const es = host.querySelector(`[data-grantent="${CSS.escape(sel.dataset.grantsel)}"]`);
    if (es) es.innerHTML = entOptions(sel.value, sel.dataset.grantsel);
  }));
  host.querySelectorAll('[data-grant]').forEach((b) => b.addEventListener('click', () => {
    const sel = host.querySelector(`[data-grantsel="${CSS.escape(b.dataset.grant)}"]`);
    const es = host.querySelector(`[data-grantent="${CSS.escape(b.dataset.grant)}"]`);
    if (!sel || !sel.value || !es || !es.value) return;
    run({ action: 'grant_position', targetAdminId: b.dataset.grant, position: sel.value, entityCode: es.value });
  }));
  host.querySelectorAll('[data-revoke]').forEach((b) => b.addEventListener('click', () => {
    const [id, code, ent] = b.dataset.revoke.split('|');
    run({ action: 'revoke_position', targetAdminId: id, position: code, entityCode: ent });
  }));
}

// ⭐ 与 `OPS-7a` 角标同口径：fire-and-forget，拉⛔ 不到就⛔ 不显示，
//   ⚠️ ⛔ 阻断任何流程，但失败在控制台留一行，📌 ⛔ 静默。
/** ⭐ 把一份 `list_requests` 结果应用到角标 —— ⛔ 发请求。 */
function applyApprovalBadge(r) {
  if (!r) return;
  const pend = r.canApprove ? (r.pending || []).length : 0;
  const post = r.canApprove ? (r.breakGlass || []).length : 0;
  if (pend === state.cfgPending && post === state.cfgPostReview) return;
  state.cfgPending = pend;
  state.cfgPostReview = post;
  refreshTabBadgesOnly();
}

async function refreshApprovalBadge() {
  try {
    const r = await callFn('sfk-admin-config-update', { action: 'list_requests' });
    // 🔴 「待我审批」只对**持核准权**的人有意义（`D2` §三）
    const pend = r.canApprove ? (r.pending || []).length : 0;
    const post = r.canApprove ? (r.breakGlass || []).length : 0;
    // 🔴🔴 **⛔ 无变化就⛔ 不重渲染** —— ⚠️ 这⛔ 不是性能优化，是**修一个竞态**：
    //   📌 `renderApp()` 会把整个 `#tabContent` 换掉。⭐ 而配置页冷启动要 ~20 秒，
    //   ⇒ 🔴 角标在它渲染**进行中**完成 ⇒ **前一次渲染的后半截写进了已脱离文档的节点**
    //   ⇒ ⚠️ 表现是「三岗只出现两个」「岗位授予区整块空白」这种**半截 DOM**。
    // ⭐ 浏览器实测查出（2026-09-11）—— 📌 SQL 与单测**永远看⛔ 不到这个**。
    if (pend === state.cfgPending && post === state.cfgPostReview) return;
    state.cfgPending = pend;
    state.cfgPostReview = post;
    refreshTabBadgesOnly();   // ⭐ ⛔ 不重建 #tabContent（见上）
  } catch (e) {
    console.error('E2 审批角标拉取失败（⛔ 不阻断）：', e.message);
  }
}

// ==================== 配置管理 ====================
// 🔴🔴 **可重入保护** —— ⚠️ 浏览器实测查出的真 bug（2026-09-11）：
//   📌 `renderConfigTab` 会被**并发调用**：另外两个角标刷新（`refreshOpsBadge`／
//   `refreshTicketsBadge`）完成时都会 `renderApp()`，⭐ 而它会把 `#tabContent`
//   重置成 `Loading…` 并**重新调一次本函数**。
//   ⇒ 🔴 于是「前一次」走到取宿主节点那一步时拿到 **`null`**
//   ⇒ ⚠️ `Cannot set properties of null (setting 'innerHTML')` ⇒ **半截 DOM**
//     （实测表现：岗位授予整块空白、三岗只出现两个）。
// ⇒ ## ⭐ **每次进来领一个号；每个 `await` 之后号变了就当场退出。**
//   📌 ⚠️ **⛔ 不去改那两个角标函数** —— 它们是既有行为，⭐ 而**⛔ 不管谁触发重渲染，
//   这里都该是安全的**。🔴 在调用方一个个堵，永远堵⛔ 不完。
let cfgRenderToken = 0;
// TD-60 ①：通用配置保存成功后，重渲染时在页面顶部显示一次的结果横幅
let cfgSaveNotice = null;
async function renderConfigTab(el) {
  const myToken = ++cfgRenderToken;
  const stale = () => myToken !== cfgRenderToken;
  // ⚠️ 🔴 **浏览器实测：这一屏冷启动要 ~20 秒**（两次 Edge Function 冷启动 ＋ 配置全量）
  //   📌 而项目纪律写着「任何 >5 秒的转圈必须显示**在干什么**的阶段文字」。
  //   ⭐ 原来只有一个 `Loading…` ⇒ 🔴 运营会以为**卡死了**。
  const stage = (k) => {
    const n = el.querySelector('#cfgLoadStage');
    if (n) n.textContent = osT(k);
  };
  el.innerHTML = `<p class="loading">${escapeHtml(osT('adminCommonLoading'))}`
    + `<br><small id="cfgLoadStage" class="muted">${escapeHtml(osT('cfgLoadingPerms'))}</small></p>`;
  stage('cfgLoadingConfigs');
  const [{ data: configs, error: cErr }, { data: regions, error: rErr }] = await Promise.all([
    supabase.from('platform_config').select('*').order('key'),
    supabase.from('region_restrictions').select('*').order('restricted_at', { ascending: false }),
  ]);
  if (cErr || rErr) {
    el.innerHTML = `<p class="error">${escapeHtml(osT('adminCommonLoadFailed'))}${escapeHtml((cErr || rErr).message)}</p>`;
    return;
  }

  // 🔴 `E1`：**收入参数走具名界面**（`GOV-1` 达标线①）——
  //   ⚠️ 裸 JSON 文本框⛔ 不算「后台可改」，📌 那是让运营写代码。
  // ⭐ `cost` ／ `operational` 档**维持原样**（`D1` §五②：单人即改、⛔ 走复核）
  //   ⇒ 📌 它们继续用下面那张 JSON 表，⚠️ ⛔ 是「⛔ 没做完」，是**刻意⛔ 不做**。
  // 🔴 `TD-108`：**一次 bootstrap 取齐** —— ⚠️ 原来这一屏要发 3 次 Edge Function 请求
  //   （`my_permissions` ／ `list_requests` ／ `list_positions`），📌 **串行**，每次约 2 秒。
  //   ⭐ 实测：渲染只要 4 毫秒，⇒ 🔴 **8.6 秒里几乎全是这几次往返。**
  let myPerms = { positions: [], permissions: [] };
  let boot = null;
  stage('cfgLoadingPerms');
  try {
    boot = await callFn('sfk-admin-config-update', { action: 'admin_config_bootstrap' });
    myPerms = { positions: boot.positions || [], permissions: boot.permissions || [], solePrincipal: boot.solePrincipal === true };
  } catch (e) {
    // ⚠️ 取⛔ 不到 ⇒ **按⛔ 无权限渲染**（只读）—— 📌 失效方向在「拒」那一侧
    console.error('admin_config_bootstrap failed:', e.message);
  }
  stage('cfgLoadingRender');
  if (stale()) return;                 // ⭐ 取数期间被重渲染过 ⇒ 📌 本次作废
  const nonRevenue = configs.filter((c) => c.revenue_class !== 'revenue');

  el.innerHTML = `
    <p id="cfgSaveBanner" class="status"></p>
    <div id="govCfgHost"></div>
    <section class="panel"><h2>${escapeHtml(osT('cfgRevenueHeading'))}</h2></section>
    <div id="revenueCfgHost"></div>
    <div id="posCfgHost"></div>
    <section class="panel">
      <h2>${escapeHtml(osT('cfgOtherHeading'))}</h2>

          <input type="text" id="addRegionReason" placeholder="${escapeHtml(osT('adminRegionReasonPh'))}" required />

        <p class="muted">${escapeHtml(osT('adminCfgJsonHint'))}</p>
        <label>${escapeHtml(osT('adminCfgReason'))}<input type="text" id="editReasonInput" /></label>
        <p id="editModalStatus" class="status"></p>
        <div class="modal-actions">
          <button id="editModalCancel" class="ghost-btn">${escapeHtml(osT('adminCommonCancel'))}</button>
          <button id="editModalSubmit">${escapeHtml(osT('adminCommonSave'))}</button>
        </div>
      </div>
    </div>
  `;

  // ⭐ 每段之前都重新取宿主 ＋ 查号 —— ⚠️ 📌 中途被重渲染就**⛔ 不再往下写**
  const host = (id) => (stale() ? null : document.getElementById(id));
  const h1 = host('revenueCfgHost');
  if (h1) await renderRevenueConfigSection(h1, configs, myPerms);
  const h2 = host('govCfgHost');
  if (h2) await renderGovernanceSections(h2, myPerms, boot?.requests);
  const h3 = host('posCfgHost');
  if (h3) await renderPositionsSection(h3, boot?.positionsData);
  if (stale()) return;

  // TD-60 ①：上一次保存的结果横幅（渲染一次即清空）
  if (cfgSaveNotice) {
    const b = document.getElementById('cfgSaveBanner');
    if (b) { b.textContent = cfgSaveNotice.text; b.style.color = cfgSaveNotice.warn ? '#8a6d00' : '#1A3D2B'; }
    cfgSaveNotice = null;
  }
  const configByKey = Object.fromEntries(configs.map((c) => [c.key, c]));
  el.querySelectorAll('[data-edit-key]').forEach((btn) => {
    btn.addEventListener('click', () => openConfigEditModal(configByKey[btn.dataset.editKey]));
  });

  if (hasRole('operator')) {
    el.querySelectorAll('[data-remove-region]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm(osT('adminRegionRemoveConfirm').replace('{code}', btn.dataset.removeRegion))) return;
        const reason = prompt(osT('adminRegionRemoveReason'));
        if (!reason) return;
        try {
          await callFn('sfk-admin-region-update', { action: 'remove', regionCode: btn.dataset.removeRegion, reason });
          renderConfigTab(el);
        } catch (e) {
          document.getElementById('regionStatus').textContent = osT('adminCommonOpFailed2') + e.message;
        }
      });
    });

    document.getElementById('addRegionForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const regionCode = document.getElementById('addRegionCode').value.trim();
      const regionName = document.getElementById('addRegionName').value.trim();
      const reason = document.getElementById('addRegionReason').value.trim();
      const statusEl = document.getElementById('regionStatus');
      statusEl.textContent = osT('adminCommonSubmitting');
      try {
        await callFn('sfk-admin-region-update', { action: 'add', regionCode, regionName, reason });
        renderConfigTab(el);
      } catch (e) {
        statusEl.textContent = osT('adminCommonOpFailed2') + e.message;
      }
    });
  }

  // ==================== TD-60 通用配置保存：结果判定（纯函数，admin/tests/td60_config_save_ui.test.mjs 现场抽取）====================
  // ⭐ 键顺序无关的规范化：jsonb 会重排对象键 ⇒ ⛔ 能直接比 JSON.stringify
  function cfgCanonicalJson(v) {
    if (Array.isArray(v)) return '[' + v.map(cfgCanonicalJson).join(',') + ']';
    if (v && typeof v === 'object') {
      return '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + cfgCanonicalJson(v[k])).join(',') + '}';
    }
    return JSON.stringify(v);
  }
  // 🔴 ④ ⛔ 信回执，信回读：回读失败／读⛔ 到／值⛔ 一致 ⇒ 一律 mismatch（弹窗保持打开）
  function cfgSaveOutcome(resp, readback, submitted) {
    if (!readback || readback.error || !readback.row) return 'mismatch';
    if (cfgCanonicalJson(readback.row.value) !== cfgCanonicalJson(submitted)) return 'mismatch';
    return resp && resp.auditWritten === false ? 'saved_no_audit' : 'saved';
  }
  // ==================== TD-60 纯函数结束 ====================

  function openConfigEditModal(config) {
    const modal = document.getElementById('configEditModal');
    document.getElementById('editModalTitle').textContent = config.key;
    document.getElementById('editValueInput').value = JSON.stringify(config.value, null, 2);
    document.getElementById('editReasonInput').value = '';
    document.getElementById('editModalStatus').textContent = '';
    document.getElementById('editModalStatus').classList.remove('error');
    modal.classList.remove('hidden');
    document.getElementById('editModalCancel').onclick = () => modal.classList.add('hidden');
    document.getElementById('editModalSubmit').onclick = async () => {
      const statusEl = document.getElementById('editModalStatus');
      // 🔴 TD-60 ②：失败一律红色显眼（`.error` 样式既有），⛔ 只一行灰字
      const fail = (text) => { statusEl.classList.add('error'); statusEl.textContent = text; };
      statusEl.classList.remove('error');
      let newValue;
      try {
        newValue = JSON.parse(document.getElementById('editValueInput').value);
      } catch {
        fail(osT('adminCfgBadJson'));
        return;
      }
      const reason = document.getElementById('editReasonInput').value.trim();
      if (!reason) { fail(osT('adminCfgReasonRequired')); return; }
      statusEl.textContent = osT('adminCommonSaving');
      let resp;
      try {
        resp = await callFn('sfk-admin-config-update', { key: config.key, newValue, reason });
      } catch (e) {
        // ⭐ 收入参数要走「提出→核准」：这是流程⛔ 是故障 ⇒ 给去处，⛔ 报「保存失败」
        if (String(e.message).includes('CONFIG_REQUIRES_APPROVAL')) { fail(osT('adminCfgNeedsApproval')); return; }
        fail(osT('adminCommonSaveFailed') + e.message);
        return;
      }
      // 🔴 TD-60 ④：回读核对 —— 回执说成功⛔ 够
      const { data: row, error: rbErr } = await supabase.from('platform_config').select('value').eq('key', config.key).maybeSingle();
      const outcome = cfgSaveOutcome(resp, { row, error: rbErr }, newValue);
      if (outcome === 'mismatch') { fail(osT('adminCfgReadbackMismatch').replace('{key}', config.key)); return; }
      // 🔴 TD-60 ①：成功必须有明确反馈 —— 关弹窗、刷新、页面顶部一条横幅
      cfgSaveNotice = {
        warn: outcome === 'saved_no_audit',
        text: osT(outcome === 'saved_no_audit' ? 'adminCfgSavedNoAudit' : 'adminCfgSavedVerified').replace('{key}', config.key),
      };
      modal.classList.add('hidden');
      renderConfigTab(el);
    };
  }
}

function renderUsersTab(el) {
  el.innerHTML = `
    <section class="panel">
      <h2>${escapeHtml(osT('adminUserHeading'))}</h2>
      <form id="userSearchForm" class="inline-form">
        <input type="text" id="userSearchInput" placeholder="${escapeHtml(osT('adminUserSearchPh'))}" required style="min-width:260px" />
        <button type="submit">${escapeHtml(osT('adminCommonSearch'))}</button>
      </form>
      <p id="userSearchStatus" class="status"></p>
      <div id="userResult"></div>
    </section>
  `;

  document.getElementById('userSearchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('userSearchInput').value.trim();
    const statusEl = document.getElementById('userSearchStatus');
    const resultEl = document.getElementById('userResult');
    statusEl.textContent = osT('adminUserSearching');
    resultEl.innerHTML = '';
    try {
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(input);
      const lookupArgs = isUuid ? { userId: input } : { email: input };
      const data = await callFn('sfk-admin-user-lookup', lookupArgs);
      statusEl.textContent = '';
      // A1：把「重查」这个动作交给 renderUserResult —— 处置完要刷新，
      //   ⛔ 不能让运营对着改动前的页面继续点。
      const reload = async () => {
        const fresh = await callFn('sfk-admin-user-lookup', lookupArgs);
        renderUserResult(resultEl, fresh, reload);
      };
      renderUserResult(resultEl, data, reload);
    } catch (e) {
      statusEl.textContent = osT('adminUserSearchFailed') + e.message;
    }
  });
}

function bindSubscriptionActions(data, reload) {
  const statusEl = () => document.getElementById('subActionStatus');
  const call = async (payload, okMsg) => {
    const el = statusEl();
    el.style.color = '';
    el.textContent = osT('adminCommonSubmitting');
    try {
      const r = await callFn('sfk-admin-subscription-manage', payload);
      el.textContent = typeof okMsg === 'function' ? okMsg(r) : okMsg;
      // ⚠️ 处置完必须**重查**，⛔ 不能让运营对着改动前的页面继续操作。
      await reload();
    } catch (err) {
      el.style.color = '#C0392B';
      el.textContent = osT('adminCommonFailed') + err.message;
    }
  };
  document.getElementById('subRevokeBtn')?.addEventListener('click', () => call({
    action: 'revoke',
    subscriptionId: document.getElementById('subRevokeId').value,
    reason: document.getElementById('subRevokeReason').value.trim(),
  }, osT('adminSubRevokedOk')));
  document.getElementById('subFixBtn')?.addEventListener('click', () => call({
    action: 'fix_multi_active',
    userId: data.user.id,
    reason: document.getElementById('subFixReason').value.trim(),
  }, (r) => osT('adminSubFixedOk').replace('{n}', r.expiredCount)));
  document.getElementById('subGrantBtn')?.addEventListener('click', () => {
    const d = document.getElementById('subGrantEnd').value;
    call({
      action: 'grant',
      userId: data.user.id,
      tierCode: document.getElementById('subGrantTier').value,
      paymentReference: document.getElementById('subGrantRef').value.trim(),
      // ⚠️ date input 只给到日，补成当日 23:59:59Z，⛔ 不要补成 00:00（那等于少给一天）
      periodEnd: d ? new Date(d + 'T23:59:59Z').toISOString() : '',
      reason: document.getElementById('subGrantReason').value.trim(),
    }, osT('adminSubGrantedOk'));
  });
  document.getElementById('subExtendBtn')?.addEventListener('click', () => call({
    action: 'extend',
    subscriptionId: document.getElementById('subExtendId').value,
    extendDays: parseInt(document.getElementById('subExtendDays').value, 10),
    reason: document.getElementById('subExtendReason').value.trim(),
  }, (r) => osT('adminSubExtendedOk').replace('{at}', formatDate(r.newPeriodEnd))));
}

// ⚠️ 🔴 **⛔ 提供任何「改来源」按钮** —— 📌 数据库层会直接拒绝（`ATTRIBUTION_IMMUTABLE`），
//   ⭐ 放一个点了必然报错的按钮，比⛔ 没有更糟。
const CRM_CHANNEL_LABEL = {
  institution_invite_code: 'crmAttrChInvite',
  institution_portal: 'crmAttrChPortal',
  legacy_unknown: 'crmAttrChLegacy',
};

function renderAttributionPanel(data) {
  const a = data.attribution;
  // ⚠️ ⛔ 用 `if (!a)` —— 📌 后端总是给这个对象；⛔ 给 ⇒ 说明后端是**旧版本**，
  //   ⭐ 那时**⛔ 许**静默当成「⛔ 不是商家带来的」：🔴 那是在编一个事实。
  if (a === undefined || a === null) return '';
  if (!a.isMerchantRegistered) {
    return `
    <h4>${escapeHtml(osT('crmAttrHeading'))}</h4>
    <p>${escapeHtml(osT('crmAttrIsMerchant'))}<strong>${escapeHtml(osT('crmAttrNo'))}</strong></p>
    <p class="muted">${escapeHtml(osT('crmAttrImmutable'))}</p>`;
  }
  const chKey = CRM_CHANNEL_LABEL[a.channel];
  return `
    <h4>${escapeHtml(osT('crmAttrHeading'))}</h4>
    <p>${escapeHtml(osT('crmAttrIsMerchant'))}<strong>${escapeHtml(osT('crmAttrYes'))}</strong></p>
    <p>${escapeHtml(osT('crmAttrInstitution'))}${a.institutionName
      ? `<strong>${escapeHtml(a.institutionName)}</strong>`
      : `<span class="error">${escapeHtml(osT('crmAttrInstMissing'))}</span>`}
      <span class="muted mono">${escapeHtml(a.institutionId || '')}</span></p>
    <p>${escapeHtml(osT('crmAttrChannel'))}${chKey
      ? escapeHtml(osT(chKey))
      : `<span class="muted">${escapeHtml(a.channel || '-')}</span>`}</p>
    <p>${escapeHtml(osT('crmAttrTime'))}${escapeHtml(formatDate(a.attributedAt) || '-')}</p>
    <p class="muted">${escapeHtml(osT('crmAttrImmutable'))}</p>`;
}

function renderUserResult(el, data, reload) {
  const { user, profile, wallet, subscription, recentTokenLedger } = data;
  el.innerHTML = `
    <div class="user-card">
      <h3>${escapeHtml(user.email || osT('adminUserNoEmail'))} <span class="muted mono">${escapeHtml(user.id)}</span></h3>
      <div class="grid-2">
        <div>
          <h4>${escapeHtml(osT('adminProfileHeading'))}</h4>
          <p>${escapeHtml(osT('adminProfileName'))}${escapeHtml(profile?.display_name || '-')}</p>
          <p>${escapeHtml(osT('adminProfileStatus'))}${escapeHtml(profile?.account_status || '-')}</p>
          <p>${escapeHtml(osT('adminProfileRegion'))}${escapeHtml(profile?.declared_region || '-')}</p>
          <p>${escapeHtml(osT('adminProfilePhone'))}${escapeHtml(profile?.phone_number || '-')}</p>
            <p>${escapeHtml(osT('adminProfileAccountKind'))}<strong>${escapeHtml(accountKindLabel(profile?.account_kind))}</strong></p>
        </div>
        <div>
          <h4>${escapeHtml(osT('adminWalletHeading'))}</h4>
          <p>${escapeHtml(osT('adminWalletBalance'))}<strong>${wallet?.balance ?? '-'}</strong></p>
          ${renderSubscriptionPanel(data)}
        </div>
      </div>

      ${renderAttributionPanel(data)}

      ${renderSubscriptionHistory(data)}
      ${renderAppleNotifications(data)}
      ${renderSubscriptionActions(data)}

      ${hasRole('operator') ? `
        <h4>${escapeHtml(osT('adminAccountKindHeading'))}</h4>
        <p class="muted">${escapeHtml(osT('adminAccountKindNote'))}</p>
        <form id="accountKindForm" class="inline-form">
          <select id="accountKindSelect"></select>
          <input type="text" id="accountKindReason" placeholder="${escapeHtml(osT('adminAccountKindReasonPh'))}" style="min-width:220px" required />
          <button type="submit">${escapeHtml(osT('adminAccountKindSubmit'))}</button>
        </form>
        <p id="accountKindStatus" class="status"></p>

        <h4>${escapeHtml(osT('adminTokenAdjustHeading'))}</h4>
        <form id="tokenAdjustForm" class="inline-form">
          <input type="number" id="tokenAmount" placeholder="${escapeHtml(osT('adminTokenAmountPh'))}" required step="1" />
          <input type="text" id="tokenReason" placeholder="${escapeHtml(osT('adminTokenReasonPh'))}" style="min-width:220px" required />
          <button type="submit">${escapeHtml(osT('adminTokenSubmit'))}</button>
        </form>
        <p id="tokenAdjustStatus" class="status"></p>
      ` : ''}

      <h4>${escapeHtml(osT('adminTokenLedgerHeading'))}</h4>
      <table class="data-table">
        <thead><tr><th>${escapeHtml(osT('adminTokenColEvent'))}</th><th>${escapeHtml(osT('adminTokenColAmount'))}</th><th>${escapeHtml(osT('adminColTime'))}</th></tr></thead>
        <tbody>
          ${(recentTokenLedger || []).length === 0 ? `<tr><td colspan="3" class="muted">${escapeHtml(osT('adminNoRecordsShort'))}</td></tr>` :
            recentTokenLedger.map((t) => `<tr><td>${escapeHtml(t.event_code)}</td><td>${t.amount}</td><td class="muted">${formatDate(t.created_at)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  // A1：绑定订阅处置动作（reload 由调用方传入 —— 处置后必须重查）
  if (typeof reload === 'function') bindSubscriptionActions(data, reload);

  // ══════ 🔴 `TD-106` · 标记账户类型 ══════
  // ⚠️ 下拉框的选项**向服务端要**（服务端再向数据库约束要）——
  //   📌 前端写死一份的话，`C1-a` 新增 `unknown` 的那天会**少一个选项且⛔ 不报错**。
  const kindSel = document.getElementById('accountKindSelect');
  if (kindSel) {
    (async () => {
      try {
        const { options = [], notSettable = [] } = await callFn(
          'sfk-admin-account-kind-update', { action: 'options' });
        const cur = profile?.account_kind;
        kindSel.innerHTML = options.map((k) => {
          // ⭐ `demo` 只显示⛔ 不可选（它有删除保护，误设就撤⛔ 回来）——
          //   ⚠️ 但**当前值就是 demo 时仍要能看见它**，⛔ 则下拉框显示的⛔ 不是真实状态。
          const blocked = notSettable.includes(k) && k !== cur;
          return `<option value="${escapeHtml(k)}"${blocked ? ' disabled' : ''}${k === cur ? ' selected' : ''}>`
            + `${escapeHtml(accountKindLabel(k))}</option>`;
        }).join('');
      } catch (err) {
        // 🔴 取⛔ 到选项时**⛔ 许留一个空下拉框假装正常** ⇒ 明说失败。
        document.getElementById('accountKindStatus').textContent = osT('adminCommonFailed') + err.message;
      }
    })();
  }

  document.getElementById('accountKindForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const accountKind = document.getElementById('accountKindSelect').value;
    const reason = document.getElementById('accountKindReason').value.trim();
    const statusEl = document.getElementById('accountKindStatus');
    statusEl.textContent = osT('adminCommonSubmitting');
    try {
      const result = await callFn('sfk-admin-account-kind-update',
        { action: 'set', targetUserId: user.id, accountKind, reason });
      // ⚠️ 🔴 「选了当前值」**⛔ 许显示成「已保存」** —— 📌 那会让人以为改动生效了。
      statusEl.textContent = result.unchanged
        ? osT('adminAccountKindUnchanged')
        : osT('adminAccountKindSaved');
      if (!result.unchanged && typeof reload === 'function') reload();
    } catch (err) {
      statusEl.textContent = err.message === 'DEMO_ACCOUNT_PROTECTED'
        ? osT('adminAccountKindDemoBlocked')
        : osT('adminCommonFailed') + err.message;
    }
  });

  document.getElementById('tokenAdjustForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = parseInt(document.getElementById('tokenAmount').value, 10);
    const reason = document.getElementById('tokenReason').value.trim();
    const statusEl = document.getElementById('tokenAdjustStatus');
    statusEl.textContent = osT('adminCommonSubmitting');
    try {
      const result = await callFn('sfk-admin-token-adjust', { targetUserId: user.id, amount, reason });
      statusEl.textContent = osT('adminTokenAdjustOk').replace('{n}', result.newBalance);
      e.target.reset();
    } catch (err) {
      statusEl.textContent = osT('adminCommonFailed') + err.message;
    }
  });
}

                   ⭐ 凡⛔ 是 real 的都亮标签（测试／演示／内部／未确认），默认往安全方向显示。
                   ⚠️ 本注释在模板串里 ⇒ ⛔ 许写反引号。 -->
              <td>${escapeHtml(inst.name)}${inst.account_kind && inst.account_kind !== 'real'
                ? ` <span class="badge badge-account-kind" data-account-kind="${escapeHtml(inst.account_kind)}">${escapeHtml(accountKindLabel(inst.account_kind))}</span>`

              <td><span class="badge badge-${inst.status}">${statusLabel(inst.status)}</span></td>

              <td>${escapeHtml(inst.contact_name || '-')}</td>
              <!-- 🔴 OS-D（2026-09-08）：批发档。⚠️ 这一列此前**全仓库无写入路径**
                   ⇒ ⭐ 折扣配置建了却从未生效过（详见 sfk-admin-institution-manage 里那段）。
                   不写折扣百分比在这里 —— 它在 platform_config，两处写就会漂移。 -->
              <td><select class="wholesale-tier" data-inst="${inst.id}">
                <option value=""${!inst.wholesale_tier ? ' selected' : ''}>${escapeHtml(osT('adminInstWholesaleNone'))}</option>
                <option value="standard"${inst.wholesale_tier === 'standard' ? ' selected' : ''}>${escapeHtml(osT('procTierStandard'))}</option>
                <option value="silver"${inst.wholesale_tier === 'silver' ? ' selected' : ''}>${escapeHtml(osT('procTierSilver'))}</option>

                ${inst.status === 'approved' ? `<details class="inst-suspend-form" data-suspend-for="${escapeHtml(inst.id)}"><summary>${escapeHtml(osT('instSusRequestBtn'))}</summary>

                <!-- 🔴 CRM-1 3.6：机构详情的两个数。⚠️ 按需拉取，⛔ 跟着列表一起拉 ——
                     ⭐ 它要扫这家机构的全部预约付款，⛔ 该为「只是打开列表」付这个代价。
                     ⚠️ 🔴 本注释在一个模板串里 ⇒ ⛔ 许写反引号（本轮第七次踩）。 -->
                <button class="link-btn" data-crm-stats="${inst.id}">${escapeHtml(osT('crmInstStatsBtn'))}</button>

          `).join('')}
        </tbody>
      </table>
    </section>

    <section class="panel">
      <h2>${escapeHtml(osT('adminInstAddHeading'))}</h2>
      <form id="addInstForm" class="stack-form">
        <label>${escapeHtml(osT('adminInstName'))}<input type="text" id="instName" required /></label>
        <label>${escapeHtml(osT('adminInstType'))}
          <select id="instType" required>
            <option value="clinic">${escapeHtml(osT('adminInstClinic'))}</option>
            <option value="tcm">${escapeHtml(osT('adminInstTcm'))}</option>
            <option value="checkup_center">${escapeHtml(osT('adminInstCheckupCenter'))}</option>
            <option value="massage">${escapeHtml(osT('adminInstMassage'))}</option>
            <option value="spa">${escapeHtml(osT('adminInstSpa'))}</option>
            <option value="beauty">${escapeHtml(osT('adminInstBeauty'))}</option>
            <option value="hair_salon">${escapeHtml(osT('adminInstHairSalon'))}</option>
            <option value="medical_aesthetics">${escapeHtml(osT('adminInstMedicalAesthetics'))}</option>
          </select>
        </label>
        <label>${escapeHtml(osT('adminInstContactName'))}<input type="text" id="instContactName" /></label>
        <label>${escapeHtml(osT('adminInstContactPhone'))}<input type="text" id="instContactPhone" /></label>
        <label>${escapeHtml(osT('adminInstContactEmail'))}<input type="email" id="instContactEmail" /></label>
        <label>${escapeHtml(osT('adminInstAddress'))}<input type="text" id="instAddress" /></label>
        <div id="medicalFields" class="hidden">
          <label>${escapeHtml(osT('adminInstLicenseNumber'))}<input type="text" id="instLicenseNumber" /></label>
          <label>${escapeHtml(osT('adminInstLicenseUrl'))}<input type="text" id="instLicenseUrl" /></label>
        </div>
        <label>${escapeHtml(osT('adminInstNotes'))}<textarea id="instNotes" rows="2"></textarea></label>
        <button type="submit">${escapeHtml(osT('adminInstCreate'))}</button>
      </form>
      <p id="addInstStatus" class="status"></p>
    </section>

    <div id="reviewModal" class="modal-backdrop hidden">
      <div class="modal">
        <h3>${escapeHtml(osT('adminInstReviewHeading'))}</h3>
        <p id="reviewInstName" class="muted"></p>
        <label>${escapeHtml(osT('adminInstDecision'))}
          <select id="reviewDecision">
            <option value="approved">${escapeHtml(osT('adminInstApprove'))}</option>
            <option value="rejected">${escapeHtml(osT('adminInstReject'))}</option>
          </select>
        </label>
        <label id="rejectionReasonWrap" class="hidden">${escapeHtml(osT('adminInstRejectReason'))}<input type="text" id="rejectionReason" /></label>
        <p id="reviewModalStatus" class="status"></p>
        <div class="modal-actions">
          <button id="reviewModalCancel" class="ghost-btn">${escapeHtml(osT('adminCommonCancel'))}</button>
          <button id="reviewModalSubmit">${escapeHtml(osT('adminCommonSubmit'))}</button>
        </div>
      </div>
    </div>
  `;

  // ══════════════════════════════════════════════════════════════════
  // OS-D（2026-09-08）：批发档 —— `wholesale_tier` 的**唯一写入入口**
  // ══════════════════════════════════════════════════════════════════
  // 🔴 **保存成功与失败必须看得出区别** —— ⚠️ 这正是 `TD-待编号-A` 的教训
  //   （配置保存那次：函数返回成功、历史表却⛔ 无记录，而界面上两者几乎一样）。
  //   ⇒ ⭐ 成功：写一句 + **把新值当场读回来重渲染**（⛔ 不信自己的乐观更新）；
  //     失败：🔴 **把下拉框弹回原值**，⛔ 不留一个「看起来已经改了」的假象。
  el.querySelectorAll('select.wholesale-tier').forEach((sel) => {
    const before = sel.value;
    sel.addEventListener('change', async () => {
      const statusEl = document.getElementById('addInstStatus');
      statusEl.classList.remove('error');
      statusEl.textContent = osT('adminInstWholesaleSaving');
      sel.disabled = true;
      try {
        await callFn('sfk-admin-institution-manage', {
          action: 'set_wholesale_tier',
          institutionId: sel.dataset.inst,
          wholesaleTier: sel.value || null,
        });
        statusEl.textContent = osT('adminInstWholesaleSaved');
        // ⭐ 重新从库里读一遍，⛔ 不信本地的乐观更新
        renderInstitutionsTab(el);
      } catch (err) {
        // 🔴 失败就把下拉框弹回原值 —— ⛔ 不许留一个「看起来已经改了」的假象
        sel.value = before;
        sel.disabled = false;
        statusEl.classList.add('error');
        statusEl.textContent = err.message;
      }
    });
  });

  const typeSelect = document.getElementById('instType');
  const medicalFields = document.getElementById('medicalFields');
  typeSelect.addEventListener('change', () => {
    medicalFields.classList.toggle('hidden', typeSelect.value !== 'medical_aesthetics');
  });

  document.getElementById('addInstForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('addInstStatus');
    statusEl.textContent = osT('adminCommonSubmitting');
    try {
      await callFn('sfk-admin-institution-manage', {
        action: 'create',
        name: document.getElementById('instName').value.trim(),
        businessType: typeSelect.value,
        contactName: document.getElementById('instContactName').value.trim() || undefined,
        contactPhone: document.getElementById('instContactPhone').value.trim() || undefined,
        contactEmail: document.getElementById('instContactEmail').value.trim() || undefined,
        address: document.getElementById('instAddress').value.trim() || undefined,
        practitionerLicenseNumber: document.getElementById('instLicenseNumber').value.trim() || undefined,
        practitionerLicenseDocumentUrl: document.getElementById('instLicenseUrl').value.trim() || undefined,
        notes: document.getElementById('instNotes').value.trim() || undefined,
      });
      renderInstitutionsTab(el);
    } catch (e) {
      statusEl.textContent = osT('adminInstCreateFailed') + e.message;
    }
  });

  const instById = Object.fromEntries(institutions.map((i) => [i.id, i]));
  // 🔴 `CRM-1` 3.6：来源统计（按需）
  el.querySelectorAll('[data-crm-stats]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.crmStats;
      const box = el.querySelector(`[data-crm-stats-for="${id}"]`);
      box.textContent = osT('adminCommonLoading');
      try {
        const r = await callFn('sfk-admin-institution-manage', { action: 'attribution_stats', institutionId: id });
        // ⚠️ 🔴 **「算⛔ 出来的笔数」必须显示** —— 📌 ⛔ 则「省下 S$0」与
        //   「有 3 笔算⛔ 出来」在界面上**⛔ 无区别**，⭐ 而它们意味着完全⛔ 同的事。
        box.innerHTML = `
          <p>${escapeHtml(osT('crmInstDeveloped'))}<strong>${r.developedCustomers}</strong></p>
          <p>${escapeHtml(osT('crmInstWaivedMonth'))}<strong>S$${Number(r.waivedMonthSgd).toFixed(2)}</strong></p>
          <p>${escapeHtml(osT('crmInstWaivedTotal'))}<strong>S$${Number(r.waivedTotalSgd).toFixed(2)}</strong></p>
          ${r.unknownRows > 0 ? `<p class="error">${escapeHtml(osT('crmInstUnknown').replace('{n}', String(r.unknownRows)))}</p>` : ''}
          ${r.truncated ? `<p class="error">${escapeHtml(osT('crmInstTruncated'))}</p>` : ''}`;
      } catch (e) {
        box.innerHTML = `<p class="error">${escapeHtml(osT('crmInstStatsFailed'))}${escapeHtml(e.message)}</p>`;
      }
    });
  });

  // ══════ 🔴 TD-129 B1 ②：持照医疗档牌照核实（状态 ＋ 记录表单）══════
  // ⭐ 哪些是持照医疗档由服务端按配置判（⛔ 在界面里写死业态清单）；拉⛔ 到就⛔ 显示，⛔ 阻断列表
  renderLicenseStatus(el, institutions.map((i) => i.id));
  // ══════ 🔴 TD-129 B1 ③：暂停两人批／补核／申诉 ══════
  el.insertAdjacentHTML('afterbegin', '<div id="instSuspensionPanel"></div><div id="instAppealPanel"></div>');
  renderSuspensionPanel(el);
  renderAppealPanel(el);
  el.querySelectorAll('[data-sus-submit]').forEach((btn) => btn.addEventListener('click', async () => {
    const box = el.querySelector(`[data-suspend-for="${CSS.escape(btn.dataset.susSubmit)}"]`);
    const v = (k) => box.querySelector(`[data-sus="${k}"]`);
    const stEl = box.querySelector('[data-sus-status]');
    stEl.classList.remove('error'); stEl.textContent = osT('adminCommonSubmitting');
    try {
      const emergency = v('emergency').checked;
      await callFn('sfk-admin-institution-manage', { action: 'suspend_request', institutionId: btn.dataset.susSubmit,
        reason: v('reason').value.trim(), ticketRef: v('ticketRef').value.trim(), emergency });
      stEl.textContent = osT(emergency ? 'instSusEmergencyDone' : 'instSusSubmitted');
      renderSuspensionPanel(el);
    } catch (e) { stEl.classList.add('error'); stEl.textContent = e.message; }
  }));

  el.querySelectorAll('[data-review-id]').forEach((btn) => {
    btn.addEventListener('click', () => openReviewModal(instById[btn.dataset.reviewId]));
  });

  function openReviewModal(inst) {
    const modal = document.getElementById('reviewModal');
    document.getElementById('reviewInstName').textContent = `${inst.name}（${bizTypeLabel(inst.business_type)}）`;
    const decisionSelect = document.getElementById('reviewDecision');
    decisionSelect.value = 'approved';
    const reasonWrap = document.getElementById('rejectionReasonWrap');
    reasonWrap.classList.add('hidden');
    document.getElementById('rejectionReason').value = '';
    document.getElementById('reviewModalStatus').textContent = '';
    modal.classList.remove('hidden');

    decisionSelect.onchange = () => reasonWrap.classList.toggle('hidden', decisionSelect.value !== 'rejected');
    document.getElementById('reviewModalCancel').onclick = () => modal.classList.add('hidden');
    document.getElementById('reviewModalSubmit').onclick = async () => {
      const statusEl = document.getElementById('reviewModalStatus');
      const decision = decisionSelect.value;
      const rejectionReason = document.getElementById('rejectionReason').value.trim();
      if (decision === 'rejected' && !rejectionReason) { statusEl.textContent = osT('adminInstRejectNeedsReason'); return; }
      statusEl.textContent = osT('adminCommonSubmitting');
      try {
        await callFn('sfk-admin-institution-manage', {
          action: 'review', institutionId: inst.id, decision,
          rejectionReason: decision === 'rejected' ? rejectionReason : undefined,
        });
        modal.classList.add('hidden');
        renderInstitutionsTab(el);
      } catch (e) {
        statusEl.textContent = osT('adminCommonSubmitFailed') + e.message;
      }
    };
  }
}

  catch (e) { host.innerHTML = ''; return; }
  const rows = d.requests || [];
  host.innerHTML = `<section class="panel"><h2>${escapeHtml(osT('instSusHeading'))}</h2>
    ${rows.length ? rows.map((r) => `
      <div class="cfg-card" data-apr="${escapeHtml(r.id)}">
        <p><strong>${escapeHtml(d.names?.[r.target_ref] || r.target_ref)}</strong>
          <span class="badge badge-${r.status === 'pending' ? 'suspended' : 'approved'}">${escapeHtml(osT('approvalStatus_' + r.status))}</span>
          ${r.is_emergency ? `<span class="badge badge-rejected">${escapeHtml(osT('instSusEmergencyBadge'))}${formatDate(r.review_due_at)}</span>` : ''}</p>
        <p class="hint">${escapeHtml(osT('instSusRequestedBy'))}${formatDate(r.requested_at)} · ${escapeHtml(r.ticket_ref || '')}</p>
        <p>${escapeHtml(r.reason)}</p>
        ${r.decision_note ? `<p class="muted">${escapeHtml(r.decision_note)}</p>` : ''}
        ${r.status === 'pending' ? `<div class="cfg-card-actions">
          <input type="text" class="cfg-note" data-apr-note placeholder="${escapeHtml(osT('instSusNotePh'))}" />
          ${r.requested_by !== d.me ? `<button data-apr-go="approve">${escapeHtml(osT(r.is_emergency ? 'instSusConfirm' : 'instSusApprove'))}</button>
          <button class="ghost-btn" data-apr-go="reject">${escapeHtml(osT(r.is_emergency ? 'instSusRestore' : 'instSusReject'))}</button>` : ''}
          ${r.requested_by === d.me && !r.is_emergency ? `<button class="ghost-btn" data-apr-go="cancel">${escapeHtml(osT('instSusCancel'))}</button>` : ''}
          <span class="status" data-apr-status></span></div>` : ''}
      </div>`).join('') : `<p class="muted">${escapeHtml(osT('instSusEmpty'))}</p>`}
  </section>`;
  host.querySelectorAll('[data-apr-go]').forEach((b) => b.addEventListener('click', async () => {
    const card = b.closest('[data-apr]');
    const note = card.querySelector('[data-apr-note]').value.trim();
    const stEl = card.querySelector('[data-apr-status]');
    stEl.classList.remove('error'); stEl.textContent = osT('adminCommonSubmitting');
    try {
      const go = b.dataset.aprGo;
      await callFn('sfk-admin-institution-manage', go === 'cancel'
        ? { action: 'approval_cancel', requestId: card.dataset.apr, note: note || null }
        : { action: 'approval_decide', requestId: card.dataset.apr, decision: go, note: note || null });
      renderSuspensionPanel(el);
    } catch (e) { stEl.classList.add('error'); stEl.textContent = e.message; }
  }));
}

async function renderLicenseStatus(el, ids) {
  if (!ids.length) return;
  let statuses = {};
  try {
    statuses = (await callFn('sfk-admin-institution-manage', { action: 'license_status', institutionIds: ids })).statuses || {};
  } catch (e) {
    console.error('[TD-129] 牌照核实状态拉取失败（⛔ 影响列表）:', e.message);
    return;
  }
  Object.entries(statuses).forEach(([id, st]) => {
    const box = el.querySelector(`[data-license-for="${CSS.escape(id)}"]`);
    if (!box || !st.licensed) return;
    const latest = st.latest;
    const label = latest ? osT('instLicResult_' + latest.result) : osT('instLicNone');
    const cls = latest?.result === 'verified' ? 'badge-approved' : 'badge-suspended';
    box.innerHTML = `
      <span class="badge ${cls}">${escapeHtml(osT('instLicTier'))} · ${escapeHtml(label)}</span>
      <details class="inst-license-form"><summary>${escapeHtml(osT('instLicVerifyBtn'))}</summary>
        <p class="muted">${escapeHtml(osT('instLicHint'))}</p>
        <label>${escapeHtml(osT('instLicSourceName'))}<input type="text" data-lic="sourceName" /></label>
        <label>${escapeHtml(osT('instLicSourceUrl'))}<input type="url" data-lic="sourceUrl" /></label>
        <label>${escapeHtml(osT('instLicRegisterNo'))}<input type="text" data-lic="registerNumber" /></label>
        <label>${escapeHtml(osT('instLicResultLabel'))}<select data-lic="result">
          <option value="verified">${escapeHtml(osT('instLicResult_verified'))}</option>
          <option value="mismatch">${escapeHtml(osT('instLicResult_mismatch'))}</option>
          <option value="not_found">${escapeHtml(osT('instLicResult_not_found'))}</option>
        </select></label>
        <label>${escapeHtml(osT('instLicNote'))}<input type="text" data-lic="note" /></label>
        <button data-lic-submit="${escapeHtml(id)}">${escapeHtml(osT('instLicSubmit'))}</button>
        <span class="status" data-lic-status></span>
      </details>`;
    box.querySelector('[data-lic-submit]').addEventListener('click', async () => {
      const v = (k) => box.querySelector(`[data-lic="${k}"]`).value.trim();
      const stEl = box.querySelector('[data-lic-status]');
      stEl.classList.remove('error'); stEl.textContent = osT('adminCommonSubmitting');
      try {
        await callFn('sfk-admin-institution-manage', { action: 'verify_license', institutionId: id,
          sourceName: v('sourceName'), sourceUrl: v('sourceUrl'), registerNumber: v('registerNumber') || null,
          result: v('result'), note: v('note') || null });
        stEl.textContent = osT('instLicSaved');
        renderLicenseStatus(el, [id]);
      } catch (e) { stEl.classList.add('error'); stEl.textContent = e.message; }
    });
  });
}

// 🔴 `TD-106` · `account_kind` 的显示名
// ⚠️ **找⛔ 到对应文案时回落到原始代码**（`: k`）—— ⭐ 这是刻意的：
//   📌 `C1-a` 会往约束里加 `unknown`，⚠️ 那天如果这里回落成「-」或空，
//   运营看到的是**一个⛔ 无法分辨的空格**；⭐ 显示裸代码至少还看得出「多了个新类型」。
function accountKindLabel(k) {
  if (!k) return '-';
  const key = { real: 'adminAccountKindReal', test: 'adminAccountKindTest',
    demo: 'adminAccountKindDemo', internal: 'adminAccountKindInternal',
    unknown: 'adminAccountKindUnknown' }[k];
  return key ? osT(key) : k;
}
function bizTypeLabel(t) {
  const k = { clinic: 'adminInstClinic', tcm: 'adminInstTcm', checkup_center: 'adminInstCheckupCenter',
    massage: 'adminInstMassage', spa: 'adminInstSpa', beauty: 'adminInstBeauty',
    hair_salon: 'adminInstHairSalon', medical_aesthetics: 'adminInstTypeMedicalAestheticsShort' }[t];
  return k ? osT(k) : t;
}
function statusLabel(s) {
  const k = { pending_review: 'adminInstStPending', approved: 'adminInstStApproved',
    rejected: 'adminInstStRejected', suspended: 'adminInstStSuspended' }[s];
  return k ? osT(k) : s;
}
